<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Medsi Timeweb Diagnostics</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;padding:24px;background:#f7fbfc;color:#11424a}
    main{max-width:720px;margin:auto;background:#fff;border:1px solid rgba(15,199,206,.2);border-radius:18px;padding:20px;box-shadow:0 12px 34px rgba(15,199,206,.08)}
    h1{font-size:22px;margin:0 0 16px}.muted{color:#5f7f86}.ok{color:#168f78}.bad{color:#b84a58}
    button{width:100%;min-height:52px;border:0;border-radius:12px;background:#19bcc6;color:#fff;font-weight:800;font-size:16px}
    pre{white-space:pre-wrap;word-break:break-word;background:#f4fbfc;border-radius:12px;padding:14px;margin-top:16px;font-size:13px}
  </style>
</head>
<body><main>
  <h1>Timeweb diagnostics</h1>
  <p class="muted">Проверяет именно серверный путь Timeweb → Cloudflare и готовность PostgreSQL.</p>
  <button id="run">Проверить сейчас</button>
  <pre id="out">Нажмите кнопку.</pre>
</main>
<script>
  const out=document.getElementById('out'),btn=document.getElementById('run');
  async function run(){
    btn.disabled=true;out.textContent='Проверяем…';
    try{
      const r=await fetch('/__diag/network?ts='+Date.now(),{cache:'no-store'});
      const data=await r.json();
      out.textContent=JSON.stringify(data,null,2);
    }catch(e){out.textContent='Ошибка: '+(e&&e.message||e)}
    finally{btn.disabled=false}
  }
  btn.onclick=run;
  run();
</script></body></html>
