<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Воспитатели">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0fc7ce">

  <title>Панель воспитателей</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?">
  <link rel="apple-touch-icon" href="/apple-touch-icon2.png">
  <link rel="manifest" href="/educators-manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background:
        radial-gradient(circle at top left, rgba(15,199,206,0.12), transparent 32%),
        radial-gradient(circle at bottom right, rgba(15,199,206,0.08), transparent 28%),
        #f7fbfc;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: inherit;
      color: #11424a;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-title { font-size: 18px; font-weight: 700; margin: 0 0 10px; }
    .loader-text {
      font-size: 15px;
      color: #5f7f86;
      margin: 0 0 22px;
      min-height: 20px;
      text-align: center;
      padding: 0 20px;
    }

    .medsi-loader {
      position: relative;
      width: 104px;
      height: 48px;
      margin-top: 10px;
    }

    .medsi-dot {
      position: absolute;
      border-radius: 50%;
      background: #0fc7ce;
      box-shadow: 0 3px 10px rgba(15,199,206,0.10);
      animation: medsiFloat 1.8s infinite ease-in-out;
    }

    .medsi-dot-1 { width: 28px; height: 28px; left: 0; bottom: 2px; animation-delay: 0s; }
    .medsi-dot-2 { width: 22px; height: 22px; left: 23px; top: 1px; animation-delay: 0.12s; }
    .medsi-dot-3 { width: 19px; height: 19px; left: 45px; bottom: 8px; animation-delay: 0.24s; }
    .medsi-dot-4 { width: 16px; height: 16px; left: 66px; top: 5px; animation-delay: 0.36s; }
    .medsi-dot-5 { width: 12px; height: 12px; left: 84px; bottom: 11px; animation-delay: 0.48s; }

    @keyframes medsiFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.95; }
      50% { transform: translateY(-4px) scale(1.03); opacity: 1; }
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      min-height: 100svh;
      border: 0;
      background: #f7fbfc;
    }

    @supports (height: 100dvh) {
      iframe { height: 100dvh; min-height: 100dvh; }
    }
  </style>
</head>
<body>

  <div id="loader">
    <h1 class="loader-title">Панель воспитателей</h1>
    <p class="loader-text" id="loaderText">Подключаемся…</p>
    <div class="medsi-loader">
      <div class="medsi-dot medsi-dot-1"></div>
      <div class="medsi-dot medsi-dot-2"></div>
      <div class="medsi-dot medsi-dot-3"></div>
      <div class="medsi-dot medsi-dot-4"></div>
      <div class="medsi-dot medsi-dot-5"></div>
    </div>
  </div>

  <iframe
    id="appFrame"
    src="https://medsi-push-worker.medsi-children.workers.dev/macros/s/AKfycbzRKRjjI7NoHx8rD5ifEdrcexGuYlMEB453sOC2UTZDeBaybZiNPIY0vDTMkmeHhebVpA/exec?view=educators&v=20260709-cf-proxy"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="no-referrer"
  ></iframe>

  <script src="/notify-client.js?v=20260629-panel2"></script>
  <script>
    const loader = document.getElementById("loader");
    const loaderText = document.getElementById("loaderText");
    const frame = document.getElementById("appFrame");
    const APP_BASE_URL = "https://medsi-push-worker.medsi-children.workers.dev/macros/s/AKfycbzRKRjjI7NoHx8rD5ifEdrcexGuYlMEB453sOC2UTZDeBaybZiNPIY0vDTMkmeHhebVpA/exec";
    const PUSH_SERVICE_URL = "https://medsi-push-worker.medsi-children.workers.dev";

    function buildIframeUrl() {
      const url = APP_BASE_URL + "?view=educators&v=20260709-cf-proxy";
      return url;
    }

    const phrases = ["Одну минуточку…", "Загружаем интерфейс…", "Почти готово…", "Ещё секундочку…"];

    let i = 0;
    const interval = setInterval(() => {
      i = (i + 1) % phrases.length;
      loaderText.textContent = phrases[i];
    }, 950);

    frame.addEventListener("load", () => {
      clearInterval(interval);
      loader.classList.add("hidden");
      setTimeout(() => {
        loader.style.display = "none";
      }, 280);
      if (window.MedsiPush) {
        window.MedsiPush.sendCurrentSubscription().catch(() => {});
      }
    });

    if (window.MedsiPush) {
      window.MedsiPush.init({
        frameId: "appFrame",
        appEndpointUrl: APP_BASE_URL,
        pushServiceUrl: PUSH_SERVICE_URL,
        identity: { role: "educator" }
      });
    }

    function syncIframeUrl() {
      const iframeUrl = buildIframeUrl();
      if (frame.getAttribute("src") !== iframeUrl) {
        frame.src = iframeUrl;
      }
    }

    window.addEventListener("hashchange", syncIframeUrl);
    window.addEventListener("pageshow", () => {
      syncIframeUrl();
    });
    syncIframeUrl();
    window.loadStartTime = Date.now();
  </script>
</body>
</html>
