<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0fc7ce">

  <title>Панель воспитателей</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?">
  <link rel="apple-touch-icon" href="/apple-touch-icon2.png">
  <link rel="manifest" href="/tutors-manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background-color: #f7fbfc;
      background:
        radial-gradient(circle at top left, rgba(15,199,206,0.12), transparent 32%),
        radial-gradient(circle at bottom right, rgba(15,199,206,0.08), transparent 28%),
        #f7fbfc;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    html::before {
      content: "";
      position: fixed;
      z-index: -1;
      inset: -80px 0;
      background:
        radial-gradient(circle at top left, rgba(15,199,206,0.12), transparent 32%),
        radial-gradient(circle at bottom right, rgba(15,199,206,0.08), transparent 28%),
        #f7fbfc;
      pointer-events: none;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: inherit;
      color: #11424a;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-title { font-size: 18px; font-weight: 700; margin: 0 0 10px; }
    .loader-text {
      font-size: 15px;
      color: #5f7f86;
      margin: 0 0 22px;
      min-height: 20px;
      text-align: center;
      padding: 0 20px;
    }

    .medsi-loader {
      position: relative;
      width: 104px;
      height: 48px;
      margin-top: 10px;
    }

    .medsi-dot {
      position: absolute;
      border-radius: 50%;
      background: #0fc7ce;
      box-shadow: 0 3px 10px rgba(15,199,206,0.10);
      animation: medsiFloat 1.8s infinite ease-in-out;
    }

    .medsi-dot-1 { width: 28px; height: 28px; left: 0; bottom: 2px; animation-delay: 0s; }
    .medsi-dot-2 { width: 22px; height: 22px; left: 23px; top: 1px; animation-delay: 0.12s; }
    .medsi-dot-3 { width: 19px; height: 19px; left: 45px; bottom: 8px; animation-delay: 0.24s; }
    .medsi-dot-4 { width: 16px; height: 16px; left: 66px; top: 5px; animation-delay: 0.36s; }
    .medsi-dot-5 { width: 12px; height: 12px; left: 84px; bottom: 11px; animation-delay: 0.48s; }

    @keyframes medsiFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.95; }
      50% { transform: translateY(-4px) scale(1.03); opacity: 1; }
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #f7fbfc;
      opacity: 0;
      transition: opacity 0.42s ease;
    }

    body.app-ready iframe {
      opacity: 1;
    }

    @supports (height: 100dvh) {
      iframe { height: 100dvh; }
    }
  </style>
  <script src="/notify-client.js?v=20260710-direct-iframe"></script>
</head>
<body>

  <div id="loader">
    <h1 class="loader-title">Панель воспитателей</h1>
    <p class="loader-text" id="loaderText">Подключаемся…</p>
    <div class="medsi-loader">
      <div class="medsi-dot medsi-dot-1"></div>
      <div class="medsi-dot medsi-dot-2"></div>
      <div class="medsi-dot medsi-dot-3"></div>
      <div class="medsi-dot medsi-dot-4"></div>
      <div class="medsi-dot medsi-dot-5"></div>
    </div>
  </div>

  <iframe
    id="appFrame"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="no-referrer"
  ></iframe>

  <script>
    const loader = document.getElementById("loader");
    const loaderText = document.getElementById("loaderText");
    const frame = document.getElementById("appFrame");
    const APP_BASE_URL = "https://script.google.com/macros/s/AKfycbzRKRjjI7NoHx8rD5ifEdrcexGuYlMEB453sOC2UTZDeBaybZiNPIY0vDTMkmeHhebVpA/exec";
    const PUSH_SERVICE_URL = "https://medsi-push-worker.medsi-children.workers.dev";
    const TUTOR_SESSION_KEY = "medsi_tutor_session_v1";
    const TUTOR_SESSION_MESSAGE_TYPE = "medsi:tutor-session";
    const TUTOR_UI_MESSAGE_TYPE = "medsi:tutor-ui";
    let shellRevealed = false;

    function getSavedTutorSession() {
      try { return String(localStorage.getItem(TUTOR_SESSION_KEY) || ""); } catch (e) { return ""; }
    }

    function buildTutorIframeUrl() {
      const saved = getSavedTutorSession();
      const base = APP_BASE_URL + "?view=tutors";
      return saved ? base + "#restoreTutor=" + encodeURIComponent(saved) : base;
    }

    function saveTutorSession(token) {
      const value = String(token || "");
      if (!value) return;
      try { localStorage.setItem(TUTOR_SESSION_KEY, value); } catch (e) {}
    }

    function clearTutorSession() {
      try { localStorage.removeItem(TUTOR_SESSION_KEY); } catch (e) {}
    }

    function isAllowedTutorSessionOrigin(origin) {
      if (origin === "null" || origin === "https://script.google.com" || origin === "https://script.googleusercontent.com") return true;
      try { return /(^|\.)googleusercontent\.com$/.test(new URL(origin).hostname); } catch (e) { return false; }
    }

    function replyWithSavedTutorSession(targetWindow) {
      const target = targetWindow || frame.contentWindow;
      if (!target) return;
      target.postMessage({
        type: TUTOR_SESSION_MESSAGE_TYPE,
        action: "restore",
        token: getSavedTutorSession()
      }, "*");
    }

    function revealApp() {
      if (shellRevealed) return;
      shellRevealed = true;
      clearInterval(interval);
      document.body.classList.add("app-ready");
      loader.classList.add("hidden");
      setTimeout(() => {
        loader.style.display = "none";
      }, 440);
    }

    window.addEventListener("message", event => {
      const data = event.data || {};
      if (!isAllowedTutorSessionOrigin(event.origin)) return;
      if (data.type === TUTOR_UI_MESSAGE_TYPE && (data.action === "ready" || data.action === "auth")) {
        revealApp();
        return;
      }
      if (data.type !== TUTOR_SESSION_MESSAGE_TYPE) return;
      if (data.action === "save") {
        saveTutorSession(data.token);
      } else if (data.action === "clear") {
        clearTutorSession();
      } else if (data.action === "get") {
        replyWithSavedTutorSession(event.source);
      }
    });

    const phrases = ["Одну минуточку…", "Загружаем интерфейс…", "Почти готово…", "Ещё секундочку…"];

    let i = 0;
    const interval = setInterval(() => {
      i = (i + 1) % phrases.length;
      loaderText.textContent = phrases[i];
    }, 950);

    frame.addEventListener("load", () => {
      if (window.MedsiPush) {
        window.MedsiPush.sendCurrentSubscription().catch(() => {});
      }
      replyWithSavedTutorSession(frame.contentWindow);
    });

    if (window.MedsiPush) {
      window.MedsiPush.init({
        frameId: "appFrame",
        appEndpointUrl: APP_BASE_URL,
        pushServiceUrl: PUSH_SERVICE_URL,
        identity: { role: "educator" }
      });
    }

    frame.src = buildTutorIframeUrl();
    window.loadStartTime = Date.now();
  </script>
</body>
</html>
