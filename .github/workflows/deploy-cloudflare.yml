name: Apply Cloudflare D1 migrations

on:
  workflow_dispatch:
    inputs:
      confirm_d1_migrations:
        description: Подтверждаю применение новых миграций к production D1
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: medsi-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-auto
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIRM_D1_MIGRATIONS: ${{ inputs.confirm_d1_migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
      - name: Verify explicit migration confirmation
        run: test "$CONFIRM_D1_MIGRATIONS" = "true"
      - name: Verify release credentials
        run: test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - name: Apply production D1 migrations
        run: |
          npx --yes wrangler@4.101.0 d1 migrations apply medsi-chat-production --remote --config services/cloudflare/chat-worker/wrangler.production.toml
