name: Release changed Cloudflare Workers

on:
  pull_request:
    branches:
      - timeweb-next
    types:
      - closed
    paths:
      - services/cloudflare/chat-worker/**
      - services/cloudflare/chat-gateway/**
      - services/cloudflare/push-worker/**

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: medsi-cloudflare-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      chat_worker: ${{ steps.changed.outputs.chat_worker }}
      chat_gateway: ${{ steps.changed.outputs.chat_gateway }}
      push_worker: ${{ steps.changed.outputs.push_worker }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Detect changed Worker sources
        id: changed
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const paths = files.map(file => file.filename);
            const has = prefix => paths.some(path => path.startsWith(prefix));
            const chatPrefix = 'services/cloudflare/chat-worker/';
            const chatTouched = has(chatPrefix);
            const migrationsTouched = has(`${chatPrefix}migrations/`);
            core.setOutput('chat_worker', String(chatTouched && !migrationsTouched));
            core.setOutput('chat_gateway', String(has('services/cloudflare/chat-gateway/')));
            core.setOutput('push_worker', String(has('services/cloudflare/push-worker/')));

  deploy:
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      (needs.verify.outputs.chat_worker == 'true' ||
       needs.verify.outputs.chat_gateway == 'true' ||
       needs.verify.outputs.push_worker == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-auto
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release credentials
        run: test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy changed Worker
        env:
          CHAT_WORKER_CHANGED: ${{ needs.verify.outputs.chat_worker }}
          CHAT_GATEWAY_CHANGED: ${{ needs.verify.outputs.chat_gateway }}
          PUSH_WORKER_CHANGED: ${{ needs.verify.outputs.push_worker }}
        run: |
          if test "$CHAT_WORKER_CHANGED" = true; then
            npx --yes wrangler@4.101.0 deploy --config services/cloudflare/chat-worker/wrangler.production.toml
          fi
          if test "$CHAT_GATEWAY_CHANGED" = true; then
            npx --yes wrangler@4.101.0 deploy --config services/cloudflare/chat-gateway/wrangler.toml
          fi
          if test "$PUSH_WORKER_CHANGED" = true; then
            npm --prefix services/cloudflare/push-worker ci
            npm --prefix services/cloudflare/push-worker run deploy
          fi
