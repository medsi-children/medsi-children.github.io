name: "Медси Бот: публикация Cloudflare Workers"

on:
  push:
    branches:
      - timeweb-next
    paths:
      - services/cloudflare/chat-worker/**
      - services/cloudflare/chat-gateway/**
      - services/cloudflare/push-worker/**

permissions:
  contents: read

concurrency:
  group: medsi-cloudflare-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      chat_worker: ${{ steps.changed.outputs.chat_worker }}
      chat_gateway: ${{ steps.changed.outputs.chat_gateway }}
      push_worker: ${{ steps.changed.outputs.push_worker }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Detect changed Worker sources
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BEFORE_SHA="${CURRENT_SHA}^"
          fi
          changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          has_path() { grep -qE "$1" <<< "$changed_files"; }
          chat_worker=false
          chat_gateway=false
          push_worker=false
          if has_path '^services/cloudflare/chat-worker/' && ! has_path '^services/cloudflare/chat-worker/migrations/'; then
            chat_worker=true
          fi
          if has_path '^services/cloudflare/chat-gateway/'; then chat_gateway=true; fi
          if has_path '^services/cloudflare/push-worker/'; then push_worker=true; fi
          printf 'chat_worker=%s\n' "$chat_worker" >> "$GITHUB_OUTPUT"
          printf 'chat_gateway=%s\n' "$chat_gateway" >> "$GITHUB_OUTPUT"
          printf 'push_worker=%s\n' "$push_worker" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      (needs.verify.outputs.chat_worker == 'true' ||
       needs.verify.outputs.chat_gateway == 'true' ||
       needs.verify.outputs.push_worker == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-auto
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release credentials
        run: test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy changed Worker
        env:
          CHAT_WORKER_CHANGED: ${{ needs.verify.outputs.chat_worker }}
          CHAT_GATEWAY_CHANGED: ${{ needs.verify.outputs.chat_gateway }}
          PUSH_WORKER_CHANGED: ${{ needs.verify.outputs.push_worker }}
        run: |
          if test "$CHAT_WORKER_CHANGED" = true; then
            npx --yes wrangler@4.101.0 deploy --config services/cloudflare/chat-worker/wrangler.production.toml
          fi
          if test "$CHAT_GATEWAY_CHANGED" = true; then
            npx --yes wrangler@4.101.0 deploy --config services/cloudflare/chat-gateway/wrangler.toml
          fi
          if test "$PUSH_WORKER_CHANGED" = true; then
            npm --prefix services/cloudflare/push-worker ci
            npm --prefix services/cloudflare/push-worker run deploy
          fi
