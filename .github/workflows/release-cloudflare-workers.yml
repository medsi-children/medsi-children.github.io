name: Publish Cloudflare Workers

on:
  push:
    branches: [timeweb-next]
    paths:
      - services/cloudflare/chat-worker/**
      - services/cloudflare/chat-gateway/**
      - services/cloudflare/push-worker/**

permissions:
  contents: read

concurrency:
  group: medsi-cloudflare-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      chat_worker: ${{ steps.changed.outputs.chat_worker }}
      chat_gateway: ${{ steps.changed.outputs.chat_gateway }}
      push_worker: ${{ steps.changed.outputs.push_worker }}
      skip_release: ${{ steps.release_guard.outputs.skip_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if printf '%s' "$BEFORE" | grep -Eq '^0+$' || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff-tree --no-commit-id --name-only -r "$AFTER" > /tmp/changed-files
          else
            git diff --name-only "$BEFORE" "$AFTER" > /tmp/changed-files
          fi
          chat_worker=false
          chat_gateway=false
          push_worker=false
          while IFS= read -r path; do
            case "$path" in
              services/cloudflare/chat-worker/migrations/*) ;;
              services/cloudflare/chat-worker/*) chat_worker=true ;;
              services/cloudflare/chat-gateway/*) chat_gateway=true ;;
              services/cloudflare/push-worker/*) push_worker=true ;;
            esac
          done < /tmp/changed-files
          echo "chat_worker=$chat_worker" >> "$GITHUB_OUTPUT"
          echo "chat_gateway=$chat_gateway" >> "$GITHUB_OUTPUT"
          echo "push_worker=$push_worker" >> "$GITHUB_OUTPUT"
      - id: release_guard
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$COMMIT_MESSAGE" | grep -Fq '[skip-service-release]'; then
            echo 'skip_release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip_release=false' >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: verify
    if: >-
      needs.verify.outputs.skip_release != 'true' &&
      (needs.verify.outputs.chat_worker == 'true' ||
       needs.verify.outputs.chat_gateway == 'true' ||
       needs.verify.outputs.push_worker == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-auto
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CHAT_WORKER_CHANGED: ${{ needs.verify.outputs.chat_worker }}
      CHAT_GATEWAY_CHANGED: ${{ needs.verify.outputs.chat_gateway }}
      PUSH_WORKER_CHANGED: ${{ needs.verify.outputs.push_worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release credentials
        run: test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - name: Publish only changed Workers
        run: |
          set -euo pipefail
          if test "$CHAT_WORKER_CHANGED" = true; then
            npx --yes wrangler@4.101.0 deploy --keep-vars --config services/cloudflare/chat-worker/wrangler.worker.toml
          fi
          if test "$CHAT_GATEWAY_CHANGED" = true; then
            npx --yes wrangler@4.101.0 deploy --keep-vars --config services/cloudflare/chat-gateway/wrangler.toml
          fi
          if test "$PUSH_WORKER_CHANGED" = true; then
            cd services/cloudflare/push-worker
            npm ci
            npx --yes wrangler@4.101.0 deploy --keep-vars
          fi
