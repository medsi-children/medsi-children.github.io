name: Publish Apps Script

on:
  push:
    branches: [timeweb-next]
    paths: [apps-script/medsi-bot/**]

permissions:
  contents: read

concurrency:
  group: medsi-apps-script-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip_release: ${{ steps.release_guard.outputs.skip_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - id: release_guard
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$COMMIT_MESSAGE" | grep -Fq '[skip-service-release]'; then
            echo 'skip_release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip_release=false' >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: verify
    if: needs.verify.outputs.skip_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apps-script-auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update the existing web application
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          set +x
          test -n "$CLASPRC_JSON"
          test -n "$APPS_SCRIPT_ID"
          test -n "$APPS_SCRIPT_DEPLOYMENT_ID"
          cleanup() {
            rm -f "$HOME/.clasprc.json" "$GITHUB_WORKSPACE/apps-script/medsi-bot/.clasp.json"
          }
          trap cleanup EXIT
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s"}\n' "$APPS_SCRIPT_ID" > "$GITHUB_WORKSPACE/apps-script/medsi-bot/.clasp.json"
          cd "$GITHUB_WORKSPACE/apps-script/medsi-bot"
          npx --yes @google/clasp@3.3.0 push --force >/dev/null 2>&1 || {
            echo '::error::Apps Script source update failed.'
            exit 1
          }
          npx --yes @google/clasp@3.3.0 deploy --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" --description "GitHub release" >/dev/null 2>&1 || {
            echo '::error::Apps Script web application update failed.'
            exit 1
          }
          echo 'Apps Script published through its existing web application.'
