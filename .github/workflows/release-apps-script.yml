name: Медси Бот: публикация Apps Script

on:
  pull_request:
    branches:
      - timeweb-next
    types:
      - closed
    paths:
      - apps-script/medsi-bot/**

permissions:
  contents: read

concurrency:
  group: medsi-apps-script-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  release:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apps-script-auto
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Push source and update the existing web deployment
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          set +x
          test -n "$CLASPRC_JSON"
          test -n "$APPS_SCRIPT_ID"
          test -n "$APPS_SCRIPT_DEPLOYMENT_ID"

          cleanup() {
            rm -f "$HOME/.clasprc.json" "$GITHUB_WORKSPACE/apps-script/medsi-bot/.clasp.json"
          }
          trap cleanup EXIT

          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s"}\n' "$APPS_SCRIPT_ID" > "$GITHUB_WORKSPACE/apps-script/medsi-bot/.clasp.json"

          cd "$GITHUB_WORKSPACE/apps-script/medsi-bot"
          if ! npx --yes @google/clasp@3.3.0 push --force >/dev/null 2>&1; then
            echo "::error::Apps Script source push failed; command output was suppressed to protect credentials."
            exit 1
          fi
          echo "Apps Script source sync completed."

          if ! npx --yes @google/clasp@3.3.0 create-deployment --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" --description "GitHub release" >/dev/null 2>&1; then
            echo "::error::Apps Script deployment update failed; command output was suppressed to protect identifiers and credentials."
            exit 1
          fi
          echo "Existing Apps Script web deployment updated."
