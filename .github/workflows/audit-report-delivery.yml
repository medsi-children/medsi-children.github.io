name: Audit production report delivery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read aggregate health without patient data
        run: |
          set -euo pipefail
          npx --yes wrangler@4.101.0 d1 execute medsi-chat-production --remote --config services/cloudflare/chat-worker/wrangler.production.toml --json --command "SELECT COUNT(*) AS profiles, SUM(CASE WHEN child_genitive <> '' THEN 1 ELSE 0 END) AS profiles_with_genitive, SUM(CASE WHEN relationship <> 'Родитель' THEN 1 ELSE 0 END) AS profiles_with_specific_role FROM chat_profiles; SELECT status, COUNT(*) AS submissions FROM report_submission_queue GROUP BY status; SELECT COUNT(*) AS stalled_submissions FROM report_submission_queue WHERE status IN ('pending','retry','processing') AND updated_at < (unixepoch()*1000 - 600000); SELECT kind, COUNT(*) AS current_reports FROM report_current WHERE text <> '' GROUP BY kind;" > /tmp/medsi-audit.json || { cat /tmp/medsi-audit.json; exit 1; }
          node -e 'const fs=require("node:fs");const data=JSON.parse(fs.readFileSync("/tmp/medsi-audit.json","utf8"));if(!Array.isArray(data)||data.some(x=>x.success!==true))throw new Error("D1 audit failed");for(const x of data)console.log(JSON.stringify(x.results));'
