name: Apply report history psychology migration 0010

on:
  push:
    branches:
      - timeweb-next
    paths:
      - services/cloudflare/chat-worker/migrations/0010_report_snapshot_psychology.sql
      - .github/workflows/apply-report-history-0010.yml

permissions:
  contents: read

concurrency:
  group: medsi-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[apply-d1-0010]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
      - name: Verify explicit one-time migration marker
        run: |
          test "${GITHUB_EVENT_NAME}" = "push"
          git log -1 --pretty=%B | grep -Fq '[apply-d1-0010]'
          test -f services/cloudflare/chat-worker/migrations/0010_report_snapshot_psychology.sql
      - name: Verify release credentials
        run: test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - name: Apply production D1 migration 0010
        run: |
          npx --yes wrangler@4.101.0 d1 migrations apply medsi-chat-production --remote --config services/cloudflare/chat-worker/wrangler.production.toml
