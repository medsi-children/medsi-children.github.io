<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#0fc7ce" />
  <title>Медси Бот</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/parents-test-manifest.json" />
  <style>
    :root { --shell-viewport-height: 100vh; }
    @supports (height: 100dvh) { :root { --shell-viewport-height: 100dvh; } }
    html, body {
      width: 100%; height: 100%; min-height: 100%; margin: 0; padding: 0;
      overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background-color: #f7fbfc;
      background: radial-gradient(circle at top left, rgba(15,199,206,.12), transparent 32%), radial-gradient(circle at bottom right, rgba(15,199,206,.08), transparent 28%), #f7fbfc;
    }
    html::before {
      content: ""; position: fixed; z-index: -1; inset: -80px 0; pointer-events: none;
      background: radial-gradient(circle at top left, rgba(15,199,206,.12), transparent 32%), radial-gradient(circle at bottom right, rgba(15,199,206,.08), transparent 28%), #f7fbfc;
    }
    #loader { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; color: #11424a; background: inherit; transition: opacity .4s ease; }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .loader-title { margin: 0 0 10px; font-size: 18px; font-weight: 700; }
    .loader-text { min-height: 20px; margin: 0 0 22px; padding: 0 20px; color: #5f7f86; font-size: 15px; text-align: center; }
    .dots { position: relative; width: 104px; height: 48px; margin-top: 10px; }
    .dot { position: absolute; border-radius: 50%; background: #0fc7ce; box-shadow: 0 3px 10px rgba(15,199,206,.10); animation: float 1.8s infinite ease-in-out; }
    .dot:nth-child(1) { width: 28px; height: 28px; left: 0; bottom: 2px; }
    .dot:nth-child(2) { width: 22px; height: 22px; left: 23px; top: 1px; animation-delay: .12s; }
    .dot:nth-child(3) { width: 19px; height: 19px; left: 45px; bottom: 8px; animation-delay: .24s; }
    .dot:nth-child(4) { width: 16px; height: 16px; left: 66px; top: 5px; animation-delay: .36s; }
    .dot:nth-child(5) { width: 12px; height: 12px; left: 84px; bottom: 11px; animation-delay: .48s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    iframe { position: fixed; inset: 0; width: 100vw; height: var(--shell-viewport-height); border: 0; background: #f7fbfc; opacity: 0; transition: opacity .42s ease; }
    body.ready iframe { opacity: 1; }
  </style>
  <script src="/notify-client.js?v=20260830-lower-panel"></script>
</head>
<body>
  <div id="loader"><h1 class="loader-title">Медси Бот</h1><p id="loaderText" class="loader-text">Подключаемся…</p><div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div></div>
  <iframe id="appFrame" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
  <script>
    const APP_BASE_URL = 'https://script.google.com/macros/s/AKfycbzRKRjjI7NoHx8rD5ifEdrcexGuYlMEB453sOC2UTZDeBaybZiNPIY0vDTMkmeHhebVpA/exec';
    const APP_URL = APP_BASE_URL + '?parentShell=clean';
    const PUSH_URL = 'https://medsi-push-worker.medsi-children.workers.dev';
    const PHONE_KEY = 'medsi_parent_phone';
    const SESSION_TYPE = 'medsi:parent-session';
    const PUSH_TYPE = 'medsi:push-subscription';
    const frame = document.getElementById('appFrame');
    const loader = document.getElementById('loader');
    const text = document.getElementById('loaderText');
    const phrases = ['Подключаемся…', 'Загружаем интерфейс…', 'Почти готово…'];
    let phrase = 0;
    const timer = setInterval(() => { phrase = (phrase + 1) % phrases.length; text.textContent = phrases[phrase]; }, 950);
    function digits(value) { return String(value || '').replace(/\D+/g, ''); }
    function savedPhone() { try { return digits(localStorage.getItem(PHONE_KEY)); } catch (_) { return ''; } }
    function iframeUrl() { const phone = savedPhone(); return phone ? APP_URL + '#restorePhone=' + encodeURIComponent(phone) : APP_URL; }
    function isAppOrigin(origin) { if (origin === 'null' || origin === 'https://script.google.com' || origin === 'https://script.googleusercontent.com') return true; try { return /(^|\.)googleusercontent\.com$/.test(new URL(origin).hostname); } catch (_) { return false; } }
    function reveal() { clearInterval(timer); document.body.classList.add('ready'); loader.classList.add('hidden'); setTimeout(() => { loader.style.display = 'none'; }, 440); }
    window.addEventListener('message', event => {
      const data = event.data || {};
      if (!isAppOrigin(event.origin)) return;
      if (data.type === 'medsi:parent-screen') {
        if (window.MedsiPush) window.MedsiPush.setPanelVisible(data.screen === 'screenChoose');
        return;
      }
      if (data.type !== SESSION_TYPE) return;
      if (data.action === 'save') { try { localStorage.setItem(PHONE_KEY, digits(data.phone)); } catch (_) {} }
      if (data.action === 'clear') { try { localStorage.removeItem(PHONE_KEY); } catch (_) {} }
      if (data.action === 'save' && window.MedsiPush) window.MedsiPush.setIdentity({ role: 'parent', phone: digits(data.phone) });
      if (data.action === 'clear' && window.MedsiPush) window.MedsiPush.clearIdentity();
      if (data.action === 'get' && event.source) event.source.postMessage({ type: SESSION_TYPE, action: 'restore', phone: savedPhone() }, '*');
    });
    function syncHeight() { const viewport = window.visualViewport; const height = Math.round(viewport ? viewport.height : window.innerHeight); if (height > 0) document.documentElement.style.setProperty('--shell-viewport-height', height + 'px'); }
    syncHeight(); window.addEventListener('resize', syncHeight); window.addEventListener('orientationchange', () => setTimeout(syncHeight, 120));
    if (window.visualViewport) { window.visualViewport.addEventListener('resize', syncHeight); window.visualViewport.addEventListener('scroll', syncHeight); }
    frame.addEventListener('load', () => {
      reveal();
      if (window.MedsiPush) window.MedsiPush.sendCurrentSubscription().catch(() => {});
    });
    if (window.MedsiPush) {
      const phone = savedPhone();
      window.MedsiPush.init({
        frameId: 'appFrame',
        appEndpointUrl: APP_BASE_URL,
        pushServiceUrl: PUSH_URL,
        identity: phone ? { role: 'parent', phone } : null
      });
    }
    frame.src = iframeUrl();
  </script>
</body>
</html>
