<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>Проверка сети Медси</title>
  <style>
    :root {
      --bg: #f7fbfc;
      --panel: #ffffff;
      --fg: #11424a;
      --muted: #5f7f86;
      --line: rgba(36, 211, 218, 0.24);
      --ok: #0f9f6e;
      --bad: #c24141;
      --wait: #607d86;
      --medsi: #18c4cd;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(15,199,206,0.12), transparent 34%),
        radial-gradient(circle at bottom right, rgba(15,199,206,0.08), transparent 30%),
        var(--bg);
      color: var(--fg);
      font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrap {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 34px rgba(15,199,206,0.10);
      padding: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      line-height: 1.2;
    }

    .meta {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #4dd4e6, #1bb8c9);
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      padding: 12px 16px;
      min-height: 48px;
      flex: 1;
    }

    .test {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
      background: rgba(242, 252, 253, 0.58);
    }

    .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
    }

    .name {
      font-weight: 800;
    }

    .status {
      font-size: 0.86rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .status.wait { color: var(--wait); }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }

    .detail {
      margin: 0;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .foot {
      margin: 14px 2px 0;
      color: var(--muted);
      font-size: 0.86rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Проверка сети Медси</h1>
      <p class="meta">Откройте эту страницу без VPN и с VPN. Важны статусы и время ответа.</p>

      <div class="actions">
        <button id="run" type="button">Проверить</button>
      </div>

      <div id="tests"></div>
      <p id="summary" class="foot"></p>
    </section>
  </main>

  <script>
    const WORKER = 'https://medsi-push-worker.medsi-children.workers.dev';
    const APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbzRKRjjI7NoHx8rD5ifEdrcexGuYlMEB453sOC2UTZDeBaybZiNPIY0vDTMkmeHhebVpA/exec';
    const TIMEOUT_MS = 20000;

    const tests = [
      {
        id: 'github-page',
        name: 'GitHub Pages',
        run: () => timedFetch('./network-check.html?self=' + Date.now(), { method: 'GET' })
      },
      {
        id: 'worker-root',
        name: 'Cloudflare Worker',
        run: () => timedFetch(WORKER + '/?t=' + Date.now(), { method: 'GET' })
      },
      {
        id: 'worker-api-light',
        name: 'Worker API: hasUnread',
        run: () => timedFetch(WORKER + '/api', apiOptions('hasUnreadParentChats', []))
      },
      {
        id: 'worker-api-chats',
        name: 'Worker API: unread chats',
        run: () => timedFetch(WORKER + '/api', apiOptions('listUnreadParentChats', []))
      },
      {
        id: 'appscript-get',
        name: 'Apps Script GET',
        run: () => timedFetch(APPS_SCRIPT + '?networkCheck=' + Date.now(), { method: 'GET', mode: 'no-cors' })
      }
    ];

    const testsBox = document.getElementById('tests');
    const summary = document.getElementById('summary');
    const runButton = document.getElementById('run');

    function apiOptions(method, args) {
      return {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ method, args })
      };
    }

    function renderTests() {
      testsBox.innerHTML = tests.map(test => (
        '<div class="test" id="' + test.id + '">' +
          '<div class="row">' +
            '<div class="name">' + test.name + '</div>' +
            '<div class="status wait">ожидает</div>' +
          '</div>' +
          '<p class="detail">-</p>' +
        '</div>'
      )).join('');
    }

    function setResult(id, status, detail) {
      const box = document.getElementById(id);
      if (!box) return;
      const statusEl = box.querySelector('.status');
      const detailEl = box.querySelector('.detail');
      statusEl.className = 'status ' + status;
      statusEl.textContent = status === 'ok' ? 'ok' : status === 'bad' ? 'ошибка' : 'проверка';
      detailEl.textContent = detail || '-';
    }

    async function timedFetch(url, options) {
      const started = performance.now();
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), TIMEOUT_MS);

      try {
        const response = await fetch(url, Object.assign({}, options || {}, {
          cache: 'no-store',
          signal: controller.signal
        }));
        const ms = Math.round(performance.now() - started);
        let text = '';
        try {
          text = await response.text();
        } catch (e) {
          text = response.type === 'opaque' ? 'opaque/no-cors response' : '';
        }
        return {
          ok: response.ok || response.type === 'opaque',
          ms,
          status: response.type === 'opaque' ? 'opaque' : response.status,
          text: text ? text.slice(0, 420) : ''
        };
      } finally {
        clearTimeout(timeout);
      }
    }

    async function runAll() {
      runButton.disabled = true;
      summary.textContent = 'Идет проверка...';
      renderTests();

      let okCount = 0;
      for (const test of tests) {
        setResult(test.id, 'wait', 'запрос отправлен...');
        try {
          const result = await test.run();
          if (result.ok) okCount += 1;
          setResult(
            test.id,
            result.ok ? 'ok' : 'bad',
            'status=' + result.status + ', time=' + result.ms + 'ms' + (result.text ? '\n' + result.text : '')
          );
        } catch (error) {
          setResult(test.id, 'bad', String(error && error.message || error));
        }
      }

      summary.textContent = 'Готово: ' + okCount + ' из ' + tests.length + ' проверок прошли. User-Agent: ' + navigator.userAgent;
      runButton.disabled = false;
    }

    runButton.addEventListener('click', runAll);
    renderTests();
    runAll();
  </script>
</body>
</html>
