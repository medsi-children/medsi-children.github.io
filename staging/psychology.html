<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Групповая психотерапия</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0fc7ce">
<meta name="format-detection" content="telephone=no">
<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?">
<link rel="apple-touch-icon" href="/apple-touch-icon2.png">

<style>
  html { -webkit-text-size-adjust: 100%; }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

  :root{
    --bg:#f7fbfc;
    --panel:#ffffff;
    --fg:#11424a;
    --muted:#5f7f86;

    --stroke:rgba(36,211,218,0.18);
    --stroke2:rgba(36,211,218,0.30);

    --medsi:#24d3da;
    --medsi-dark:#16b8c0;
    --medsi-soft:#eefcfd;
    --medsi-soft-2:#dcf8fa;

    --psycho-grad:linear-gradient(135deg,#f9a8d4,#f472b6);
    --psycho-shadow:0 8px 20px rgba(244,114,182,.22);

    --btn-bg:#f2fcfd;
    --btn-brd:rgba(36,211,218,0.24);
    --focus:rgba(36,211,218,0.55);

    --btn-pink:linear-gradient(135deg,#f9a8d4,#f472b6);
  }

  html,body{
    height:100%;
    margin:0;
    background:
      radial-gradient(circle at top left, rgba(15,199,206,0.10), transparent 32%),
      radial-gradient(circle at bottom right, rgba(15,199,206,0.08), transparent 28%),
      var(--bg);
    color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Helvetica Neue,Arial;
    font-size:17px;
    line-height:1.7;
    overflow-x:hidden;
  }

  @supports (height: 100dvh){
    body{ min-height:100dvh; }
  }

  @media (hover: none) and (any-pointer: coarse){
    html,body{
      font-size:18px !important;
      line-height:1.65 !important;
    }

    .wrap{
      min-height:100dvh !important;
      align-content:start !important;
      padding-top:12px !important;
      padding-left:10px !important;
      padding-right:10px !important;
      padding-bottom:calc(10px + env(safe-area-inset-bottom)) !important;
    }

    .frame{
      width:min(720px, 100%) !important;
      max-width:720px !important;
      margin:0 auto !important;
      aspect-ratio:auto !important;
      height:calc(100dvh - 22px) !important;
      max-height:760px !important;
      min-height:520px !important;
      border-radius:22px !important;
    }

    .scene{
      padding:16px 14px !important;
    }

    textarea{
      min-height:34vh !important;
      font-size:1.05rem !important;
    }

    .btn{
      min-height:52px !important;
    }
  }

  @media (max-width:560px){
    html,body{
      font-size:16px;
      line-height:1.6;
    }
  }

  .wrap{
    min-height:100%;
    display:grid;
    place-items:center;
    padding:clamp(12px, 4vmin, 24px);
  }

  .frame{
    position:relative;
    width:min(94vmin,860px);
    aspect-ratio:1/1;
    border-radius:24px;
    background:var(--panel);
    border:1px solid var(--stroke);
    overflow:hidden;
    box-shadow:
      0 12px 34px rgba(15,199,206,0.10),
      0 0 0 1px rgba(15,199,206,0.04);
  }

  .rim{
    position:absolute;
    inset:-2px;
    border-radius:26px;
    padding:2px;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
    background:var(--psycho-grad);
    box-shadow:var(--psycho-shadow);
  }

  .scene{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    padding:18px 22px;
    overflow:auto;
    scrollbar-width:thin;
    -webkit-overflow-scrolling:touch;
  }

  .title{
    margin:0 0 8px;
    font-weight:800;
    letter-spacing:.2px;
    font-size:clamp(1.25rem,4.6vw,1.8rem);
    text-align:center;
  }

  .meta{
    margin:0 0 18px;
    color:var(--muted);
    font-size:clamp(0.95rem,3.6vw,1.05rem);
    white-space:pre-line;
    text-align:center;
  }

  .btn{
    appearance:none;
    border:1.5px solid var(--btn-brd);
    background:var(--btn-bg);
    color:var(--medsi-dark);
    padding:14px 16px;
    border-radius:12px;
    cursor:pointer;
    font-weight:800;
    min-height:56px;
    font-size:1.05rem;
    text-align:center;
  }

  .btn.block{ width:100%; }

  .soft-back-btn{
    width:auto !important;
    min-height:40px !important;
    padding:7px 16px !important;
    border-radius:999px !important;
    background:#ffffff !important;
    border:1.5px solid rgba(22,184,192,0.38) !important;
    color:var(--medsi-dark) !important;
    font-size:0.92rem !important;
    line-height:1.15 !important;
    font-weight:800 !important;
    box-shadow:0 8px 18px rgba(15,199,206,0.08);
    text-shadow:none !important;
  }

  .btn-pink{
    border:none;
    background:var(--btn-pink);
    color:#ffffff;
    text-shadow:0 1px 1px rgba(0,0,0,0.08);
  }

  .btn-loading{
    pointer-events:none;
    opacity:0.92;
  }

  .btn-spinner{
    width:18px;
    height:18px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.42);
    border-top-color:#ffffff;
    animation:btnSpin .75s linear infinite;
    flex:0 0 auto;
    display:inline-block;
    vertical-align:middle;
    transform:translateY(-1px);
  }

  @keyframes btnSpin{
    to{ transform:translateY(-1px) rotate(360deg); }
  }

  textarea{
    width:100%;
    min-height:320px;
    background:#ffffff;
    color:var(--fg);
    border:1.5px solid var(--stroke2);
    border-radius:12px;
    padding:14px 16px;
    font-size:16px;
    resize:vertical;
    outline:none;
  }

  textarea:focus{
    border-color:var(--focus);
    box-shadow:0 0 0 4px rgba(15,199,206,0.12);
  }

  textarea::placeholder{
    color:#8fa5aa;
  }

  .row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:14px;
  }

  .hidden{ display:none !important; }

  .error{
    color:#c94f4f;
    margin-top:8px;
  }
</style>
<script src="./medsi-api-client.js?v=20260709-staging-stable"></script>
</head>

<body>
<div class="wrap">
  <article class="frame">
    <div class="rim"></div>

    <div class="scene">
      <h1 class="title" id="title">Групповая психотерапия</h1>
      <p class="meta" id="meta">Вставьте отчёт в поле ввода сообщений.</p>

      <section id="screenStart">
        <button id="btnStart" class="btn btn-pink block">Отправить отчёт</button>
      </section>

      <section id="screenForm" class="hidden">
        <textarea id="text" placeholder="Вставьте весь текст отчёта сюда…"></textarea>

        <p id="error" class="error hidden" role="alert"></p>

        <div class="row">
          <button id="btnBack" class="btn soft-back-btn">← Назад в меню</button>
          <button id="btnSend" class="btn btn-pink">Отправить</button>
        </div>
      </section>

      <section id="screenDone" class="hidden">
        <p class="meta" id="doneText">Готово.</p>
      </section>
    </div>
  </article>
</div>

<script>
  const $ = id => document.getElementById(id);
  const screens = ['screenStart','screenForm','screenDone'];

  function setButtonLoading(btn, text){
    if (!btn) return;
    btn.disabled = true;
    btn.classList.add('btn-loading');
    btn.dataset.prevHtml = btn.innerHTML;
    btn.innerHTML = '<span class="btn-spinner"></span><span>' + text + '</span>';
  }

  function restoreButtonLoading(btn){
    if (!btn) return;
    btn.disabled = false;
    btn.classList.remove('btn-loading');
    if (btn.dataset.prevHtml) {
      btn.innerHTML = btn.dataset.prevHtml;
      delete btn.dataset.prevHtml;
    }
  }

  function show(id){
    screens.forEach(s => $(s).classList.toggle('hidden', s !== id));
  }

  $('btnStart').addEventListener('click', () => {
    show('screenForm');
    $('text').focus();
  });

  $('btnBack').addEventListener('click', () => {
    $('error').classList.add('hidden');
    show('screenStart');
  });

  function sanitizeText(text){
    return String(text || '')
      .replace(/[\u2028\u2029]/g, '\n')
      .replace(/[\u200B-\u200F\uFEFF]/g, '')
      .replace(/[\u00A0\u202F\u2000-\u200A]/g, ' ')
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '')
      .normalize('NFC')
      .trim();
  }

  $('btnSend').addEventListener('click', () => {
    let text = sanitizeText($('text').value || '');

    if(!text){
      $('error').textContent = 'Поле пустое.';
      $('error').classList.remove('hidden');
      return;
    }

    $('error').classList.add('hidden');

    const btn = $('btnSend');
    setButtonLoading(btn, 'Отправляем…');

    google.script.run
      .withSuccessHandler(res => {
        restoreButtonLoading(btn);

        if(!res || !res.ok){
          $('error').textContent = res?.message || 'Ошибка записи.';
          $('error').classList.remove('hidden');
          return;
        }

        $('doneText').textContent = 'Готово.';
        $('text').value = '';
        show('screenDone');
      })
      .withFailureHandler(() => {
        restoreButtonLoading(btn);
        $('error').textContent = 'Сервер недоступен.';
        $('error').classList.remove('hidden');
      })
      .appendReport({ reportType: 'psychology', text });
  });
</script>

</body>
</html>
