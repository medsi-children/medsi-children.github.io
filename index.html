<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Важно для полноэкранного режима на Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0fc7ce">

  <title>Медси Бот</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: 
        radial-gradient(circle at top left, rgba(15,199,206,0.12), transparent 32%),
        radial-gradient(circle at bottom right, rgba(15,199,206,0.08), transparent 28%),
        #f7fbfc;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    /* ===== LOADER ===== */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: inherit;
      color: #11424a;
      z-index: 10;
      transition: opacity 0.35s ease;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-title { 
      font-size: 18px; 
      font-weight: 700; 
      margin: 0 0 10px; 
    }

    .loader-text { 
      font-size: 15px; 
      color: #5f7f86; 
      margin: 0 0 22px; 
      min-height: 20px; 
      text-align: center; 
    }

    .medsi-loader {
      position: relative;
      width: 104px;
      height: 48px;
    }

    .medsi-dot {
      position: absolute;
      border-radius: 50%;
      background: #0fc7ce;
      box-shadow: 0 3px 10px rgba(15,199,206,0.10);
      animation: medsiFloat 1.8s infinite ease-in-out;
    }

    .medsi-dot-1 { width: 28px; height: 28px; left: 0; bottom: 2px; }
    .medsi-dot-2 { width: 22px; height: 22px; left: 23px; top: 1px; animation-delay: 0.1s; }
    .medsi-dot-3 { width: 19px; height: 19px; left: 45px; bottom: 8px; animation-delay: 0.2s; }
    .medsi-dot-4 { width: 16px; height: 16px; left: 66px; top: 5px; animation-delay: 0.3s; }
    .medsi-dot-5 { width: 12px; height: 12px; left: 84px; bottom: 11px; animation-delay: 0.4s; }

    @keyframes medsiFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.95; }
      50% { transform: translateY(-4px) scale(1.03); opacity: 1; }
    }

    .open-link {
      color: #0a9fa7;
      font-weight: 800;
      text-decoration: none;
      border-bottom: 1px solid rgba(10,159,167,0.32);
    }
  </style>
</head>
<body>

  <div id="loader">
    <h1 class="loader-title">Медси Бот</h1>
    <p class="loader-text" id="loaderText">Подключаемся…</p>
    <div class="medsi-loader">
      <div class="medsi-dot medsi-dot-1"></div>
      <div class="medsi-dot medsi-dot-2"></div>
      <div class="medsi-dot medsi-dot-3"></div>
      <div class="medsi-dot medsi-dot-4"></div>
      <div class="medsi-dot medsi-dot-5"></div>
    </div>
  </div>

  <script>
    const loaderText = document.getElementById("loaderText");

    const APP_BASE_URL = "https://script.google.com/macros/s/AKfycbzRKRjjI7NoHx8rD5ifEdrcexGuYlMEB453sOC2UTZDeBaybZiNPIY0vDTMkmeHhebVpA/exec";
    const APP_VERSION = "20260709-direct774";
    const PARENT_PHONE_KEY = "medsi_parent_phone";

    const phrases = ["Открываем Медси Бот…", "Переключаемся на рабочий адрес…", "Почти готово…"];

    function onlyDigits(value) {
      return String(value || "").replace(/\D+/g, "");
    }

    function getSavedParentPhone() {
      try { return onlyDigits(localStorage.getItem(PARENT_PHONE_KEY) || ""); } 
      catch (e) { return ""; }
    }

    function buildAppUrl() {
      const url = new URL(APP_BASE_URL);
      const source = new URLSearchParams(window.location.search || "");
      source.forEach((value, key) => {
        if (key !== "view" && key !== "v") url.searchParams.set(key, value);
      });
      url.searchParams.set("v", APP_VERSION);

      const saved = getSavedParentPhone();
      const hash = new URLSearchParams(String(window.location.hash || "").replace(/^#/, ""));
      if (saved) hash.set("restorePhone", saved);
      const hashString = hash.toString();
      if (hashString) url.hash = hashString;
      return url.toString();
    }

    const targetUrl = buildAppUrl();
    let i = 0;
    const interval = setInterval(() => {
      i = (i + 1) % phrases.length;
      loaderText.textContent = phrases[i];
    }, 850);

    setTimeout(() => {
      clearInterval(interval);
      loaderText.innerHTML = 'Если Медси Бот не открылся, <a class="open-link" href="' + targetUrl + '">нажмите сюда</a>.';
    }, 3500);

    window.location.replace(targetUrl);
    window.loadStartTime = Date.now();
  </script>
</body>
</html>
