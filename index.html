<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Важно для полноэкранного режима на Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0fc7ce">

  <title>Медси Бот</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">

  <style>
    :root { --shell-viewport-height: 100vh; }

    @supports (height: 100dvh) {
      :root { --shell-viewport-height: 100dvh; }
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: 
        radial-gradient(circle at top left, rgba(15,199,206,0.12), transparent 32%),
        radial-gradient(circle at bottom right, rgba(15,199,206,0.08), transparent 28%),
        #f7fbfc;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    /* ===== LOADER ===== */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: inherit;
      color: #11424a;
      z-index: 10;
      transition: opacity 0.35s ease;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-title { 
      font-size: 18px; 
      font-weight: 700; 
      margin: 0 0 10px; 
    }

    .loader-text { 
      font-size: 15px; 
      color: #5f7f86; 
      margin: 0 0 22px; 
      min-height: 20px; 
      text-align: center; 
    }

    .medsi-loader {
      position: relative;
      width: 104px;
      height: 48px;
    }

    .medsi-dot {
      position: absolute;
      border-radius: 50%;
      background: #0fc7ce;
      box-shadow: 0 3px 10px rgba(15,199,206,0.10);
      animation: medsiFloat 1.8s infinite ease-in-out;
    }

    .medsi-dot-1 { width: 28px; height: 28px; left: 0; bottom: 2px; }
    .medsi-dot-2 { width: 22px; height: 22px; left: 23px; top: 1px; animation-delay: 0.1s; }
    .medsi-dot-3 { width: 19px; height: 19px; left: 45px; bottom: 8px; animation-delay: 0.2s; }
    .medsi-dot-4 { width: 16px; height: 16px; left: 66px; top: 5px; animation-delay: 0.3s; }
    .medsi-dot-5 { width: 12px; height: 12px; left: 84px; bottom: 11px; animation-delay: 0.4s; }

    @keyframes medsiFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.95; }
      50% { transform: translateY(-4px) scale(1.03); opacity: 1; }
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: var(--shell-viewport-height);
      border: 0;
      background: #f7fbfc;
    }

    @supports (height: 100dvh) {
      iframe { height: var(--shell-viewport-height); }
    }
  </style>
  <script src="/notify-client.js?v=20260830-lower-panel"></script>
</head>
<body>

  <div id="loader">
    <h1 class="loader-title">Медси Бот</h1>
    <p class="loader-text" id="loaderText">Подключаемся…</p>
    <div class="medsi-loader">
      <div class="medsi-dot medsi-dot-1"></div>
      <div class="medsi-dot medsi-dot-2"></div>
      <div class="medsi-dot medsi-dot-3"></div>
      <div class="medsi-dot medsi-dot-4"></div>
      <div class="medsi-dot medsi-dot-5"></div>
    </div>
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzRKRjjI7NoHx8rD5ifEdrcexGuYlMEB453sOC2UTZDeBaybZiNPIY0vDTMkmeHhebVpA/exec"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="no-referrer"
  ></iframe>

  <script>
    const loader = document.getElementById("loader");
    const loaderText = document.getElementById("loaderText");
    const frame = document.getElementById("appFrame");

    const APP_BASE_URL = "https://script.google.com/macros/s/AKfycbzRKRjjI7NoHx8rD5ifEdrcexGuYlMEB453sOC2UTZDeBaybZiNPIY0vDTMkmeHhebVpA/exec";
    // Меняем только при выпуске важных правок интерфейса. Параметр заставляет
    // iOS заново загрузить вложенную Apps Script-панель, не сбрасывая сессию.
    const APP_UI_VERSION = "20260830-parent-frame-scene";
    const PUSH_SERVICE_URL = "https://medsi-push-worker.medsi-children.workers.dev";
    const PARENT_PHONE_KEY = "medsi_parent_phone";
    const SESSION_MESSAGE_TYPE = "medsi:parent-session";

    function syncShellViewportHeight() {
      const viewport = window.visualViewport;
      const height = Math.round(viewport ? viewport.height : window.innerHeight);
      if (height <= 0) return;
      document.documentElement.style.setProperty("--shell-viewport-height", height + "px");
      const appFrame = document.getElementById("appFrame");
      if (appFrame && appFrame.contentWindow) {
        appFrame.contentWindow.postMessage({ type: "medsi:viewport", height }, "*");
      }
    }

    syncShellViewportHeight();
    window.addEventListener("resize", syncShellViewportHeight);
    window.addEventListener("orientationchange", () => setTimeout(syncShellViewportHeight, 120));
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncShellViewportHeight);
      window.visualViewport.addEventListener("scroll", syncShellViewportHeight);
    }

    const phrases = ["Подключаемся…", "Загружаем интерфейс…", "Почти готово…", "Ещё секундочку…"];

    function onlyDigits(value) {
      return String(value || "").replace(/\D+/g, "");
    }

    function getSavedParentPhone() {
      try { return onlyDigits(localStorage.getItem(PARENT_PHONE_KEY) || ""); } 
      catch (e) { return ""; }
    }

    function buildIframeUrl() {
      const saved = getSavedParentPhone();
      const url = APP_BASE_URL + "?ui=" + encodeURIComponent(APP_UI_VERSION);
      return saved ? url + "#restorePhone=" + encodeURIComponent(saved) : url;
    }

    function saveParentPhone(phone) {
      const digits = onlyDigits(phone);
      if (!digits) return;
      try { localStorage.setItem(PARENT_PHONE_KEY, digits); }
      catch (e) {}
      if (window.MedsiPush) {
        window.MedsiPush.setIdentity({ role: "parent", phone: digits });
      }
    }

    function clearParentPhone() {
      try { localStorage.removeItem(PARENT_PHONE_KEY); }
      catch (e) {}
      if (window.MedsiPush) window.MedsiPush.clearIdentity();
    }

    function replyWithSavedPhone(targetWindow) {
      const saved = getSavedParentPhone();
      const target = targetWindow || frame.contentWindow;
      if (!saved || !target) return;
      target.postMessage({
        type: SESSION_MESSAGE_TYPE,
        action: "restore",
        phone: saved
      }, "*");
    }

    function isAllowedSessionOrigin(origin) {
      if (origin === "null") return true;
      if (origin === "https://script.google.com") return true;
      if (origin === "https://script.googleusercontent.com") return true;
      try { return /\.googleusercontent\.com$/.test(new URL(origin).hostname); }
      catch (e) { return false; }
    }

    window.addEventListener("message", (event) => {
      const data = event.data || {};
      if (data.type === "medsi:parent-screen") {
        if (!isAllowedSessionOrigin(event.origin)) return;
        if (window.MedsiPush) {
          window.MedsiPush.setPanelVisible(data.screen === "screenChoose");
        }
        return;
      }
      if (data.type !== SESSION_MESSAGE_TYPE) return;
      if (!isAllowedSessionOrigin(event.origin)) return;

      if (data.action === "save") {
        saveParentPhone(data.phone);
        return;
      }

      if (data.action === "clear") {
        clearParentPhone();
        return;
      }

      if (data.action === "get") {
        replyWithSavedPhone(event.source);
      }
    });

    let i = 0;
    const interval = setInterval(() => {
      i = (i + 1) % phrases.length;
      loaderText.textContent = phrases[i];
    }, 850);

    function hideLoader() {
      clearInterval(interval);
      loader.classList.add("hidden");
      setTimeout(() => {
        loader.style.display = "none";
      }, 350);
      if (window.MedsiPush) {
        window.MedsiPush.sendCurrentSubscription().catch(() => {});
      }
    }

    frame.addEventListener("load", () => {
      syncShellViewportHeight();
      hideLoader();
    });
    window.addEventListener("pageshow", () => {
      if (frame.contentWindow) setTimeout(hideLoader, 1200);
    });

    setTimeout(hideLoader, 6000);
    frame.src = buildIframeUrl();

    if (window.MedsiPush) {
      const saved = getSavedParentPhone();
      window.MedsiPush.init({
        frameId: "appFrame",
        appEndpointUrl: APP_BASE_URL,
        pushServiceUrl: PUSH_SERVICE_URL,
        identity: saved ? { role: "parent", phone: saved } : null
      });
    }

    window.loadStartTime = Date.now();
  </script>
</body>
</html>
