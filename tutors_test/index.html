<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#0fc7ce"><title>Медси Бот — тест чата воспитателей</title><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/apple-touch-icon2.png"><link rel="preload" as="image" href="https://medsi-children.github.io/background.png"><link rel="stylesheet" href="/chat-overlay/overlay.css?v=7"><style>:root{--shell-viewport-height:100vh}@supports(height:100dvh){:root{--shell-viewport-height:100dvh}}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7fbfc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}#loader{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f7fbfc;color:#11424a;transition:opacity .22s ease}#loader.hidden{opacity:0;pointer-events:none}.loader-title{font-size:18px;font-weight:800;margin:0 0 10px}.loader-text{font-size:14px;color:#64868b;margin:0 0 18px}.dots{display:flex;gap:7px;align-items:center;height:32px}.dots span{display:block;border-radius:50%;background:#0fc7ce;animation:float 1.3s ease-in-out infinite}.dots span:nth-child(1){width:22px;height:22px}.dots span:nth-child(2){width:18px;height:18px;animation-delay:.1s}.dots span:nth-child(3){width:14px;height:14px;animation-delay:.2s}.dots span:nth-child(4){width:11px;height:11px;animation-delay:.3s}.dots span:nth-child(5){width:8px;height:8px;animation-delay:.4s}@keyframes float{50%{transform:translateY(-5px)}}#appFrame{position:fixed;inset:0;width:100vw;height:var(--shell-viewport-height);border:0;background:#f7fbfc;opacity:0;transition:opacity .22s ease}body.app-ready #appFrame{opacity:1}</style><link rel="stylesheet" href="/chat-overlay/educator-exact.css?v=1"><link rel="stylesheet" href="/chat-overlay/overlay-fixes.css?v=7"><link rel="stylesheet" href="/chat-overlay/tutor-start-shell.css?v=1"><script src="/notify-client.js?v=20260710-direct-iframe"></script><script src="/chat-overlay/transport.js?v=3"></script><script src="/chat-overlay/fast-cache.js?v=1"></script><script src="/chat-overlay/interaction-fix.js?v=5"></script><script src="/chat-overlay/preload.js?v=2"></script><script src="/chat-overlay/educator-chat.js?v=9"></script><script src="/chat-overlay/educator-unread-fix.js?v=1"></script><script src="/chat-overlay/educator-new-chat.js?v=1"></script><script src="/chat-overlay/overlay-core.js?v=3"></script><script src="/chat-overlay/tutor-start-shell.js?v=1"></script></head><body><div id="loader"><h1 class="loader-title">Медси Бот</h1><p class="loader-text">Тестовая версия чата воспитателей</p><div class="dots"><span></span><span></span><span></span><span></span><span></span></div></div><iframe id="appFrame" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe><script>
const APP_BASE_URL='https://script.google.com/macros/s/AKfycbzRKRjjI7NoHx8rD5ifEdrcexGuYlMEB453sOC2UTZDeBaybZiNPIY0vDTMkmeHhebVpA/exec',PUSH_SERVICE_URL='https://medsi-push-worker.medsi-children.workers.dev',TUTOR_SESSION_KEY='medsi_tutor_session_v1',OVERLAY_SESSION_KEY='medsi_d1_educator_session_v1',SESSION_MESSAGE_TYPE='medsi:tutor-session',UI_MESSAGE_TYPE='medsi:tutor-ui';window.MEDSI_APP_BASE_URL=APP_BASE_URL;const frame=document.getElementById('appFrame'),loader=document.getElementById('loader');let revealed=false,overlayCleanup=null,startupShell=null,appUiReady=false;
function savedSession(){try{return String(localStorage.getItem(TUTOR_SESSION_KEY)||'')}catch(_){return''}}function saveSession(t){t=String(t||'');if(!t)return;try{localStorage.setItem(TUTOR_SESSION_KEY,t)}catch(_){} }function clearSession(){try{localStorage.removeItem(TUTOR_SESSION_KEY);localStorage.removeItem(OVERLAY_SESSION_KEY)}catch(_){}}function savedOverlaySession(){try{const s=JSON.parse(localStorage.getItem(OVERLAY_SESSION_KEY)||'null');if(!s||!s.token||Number(s.expiresAt||0)<=Date.now()+30000){localStorage.removeItem(OVERLAY_SESSION_KEY);return null}return s}catch(_){return null}}function saveOverlaySession(data){if(!data||!data.session||!data.session.token)return;try{localStorage.setItem(OVERLAY_SESSION_KEY,JSON.stringify(data.session))}catch(_){}}
function allowed(origin){if(origin==='null'||origin==='https://script.google.com'||origin==='https://script.googleusercontent.com')return true;try{return /(^|\.)googleusercontent\.com$/.test(new URL(origin).hostname)}catch(_){return false}}function replySession(target){if(target)target.postMessage({type:SESSION_MESSAGE_TYPE,action:'restore',token:savedSession()},'*')}function syncViewport(){const v=window.visualViewport,h=Math.round(v?v.height:window.innerHeight);if(h>0)document.documentElement.style.setProperty('--shell-viewport-height',h+'px')}function buildUrl(){let u=APP_BASE_URL+'?view=tutors&build=overlay-test-3&shellMode=tutors_test';const t=savedSession();if(t)u+='#restoreTutor='+encodeURIComponent(t);return u}function reveal(){if(revealed)return;revealed=true;document.body.classList.add('app-ready');loader.classList.add('hidden');setTimeout(()=>loader.style.display='none',240)}function helloOverlay(){if(frame.contentWindow)frame.contentWindow.postMessage({type:'medsi:chat-overlay',action:'hello',role:'educator',cachedSession:savedOverlaySession()},'*')}
syncViewport();requestAnimationFrame(syncViewport);setTimeout(syncViewport,120);window.addEventListener('orientationchange',()=>setTimeout(syncViewport,120));document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;syncViewport();replySession(frame.contentWindow);helloOverlay();setTimeout(helloOverlay,250)});window.addEventListener('pageshow',()=>{replySession(frame.contentWindow);helloOverlay()});window.addEventListener('message',event=>{const data=event.data||{};if(!allowed(event.origin))return;if(data.type==='medsi:chat-overlay'&&data.role==='educator'&&data.session)saveOverlaySession(data);if(data.type==='medsi:chat-overlay'&&data.action==='preload'&&data.role==='educator'){if(window.MedsiOverlayPreload)MedsiOverlayPreload.educator(data);return}if(data.type===UI_MESSAGE_TYPE&&(data.action==='ready'||data.action==='auth')){appUiReady=true;reveal();if(startupShell){startupShell.setReady(true);startupShell.hide()}return}if(data.type!==SESSION_MESSAGE_TYPE)return;if(data.action==='save')saveSession(data.token);else if(data.action==='clear')clearSession();else if(data.action==='get')replySession(event.source)});
const overlay=window.MedsiChatOverlay.create({frameId:'appFrame',onOpen:(state,api)=>{if(overlayCleanup){try{overlayCleanup()}catch(_){}overlayCleanup=null}if(state.role==='educator'&&window.MedsiEducatorOverlayChat)overlayCleanup=MedsiEducatorOverlayChat.mount(api,state)||null},onClose:()=>{if(overlayCleanup){try{overlayCleanup()}catch(_){}overlayCleanup=null}if(!appUiReady&&startupShell)startupShell.show()}});
if(window.MedsiTutorStartShell){startupShell=MedsiTutorStartShell.mount({frame,openCachedChat:()=>{const session=savedOverlaySession();if(!session)return false;overlay.open({type:'medsi:chat-overlay',action:'open',role:'educator',session});return true}});loader.style.display='none'}
frame.addEventListener('load',()=>{syncViewport();reveal();replySession(frame.contentWindow);helloOverlay();setTimeout(helloOverlay,200);if(window.MedsiPush)MedsiPush.sendCurrentSubscription().catch(()=>{})});frame.src=buildUrl();if(window.MedsiPush)MedsiPush.init({frameId:'appFrame',appEndpointUrl:APP_BASE_URL,pushServiceUrl:PUSH_SERVICE_URL,identity:{role:'educator'}});window.medsiOverlayTest=overlay;window.medsiForgetCachedChatToken=()=>{try{localStorage.removeItem(OVERLAY_SESSION_KEY)}catch(_){};return true};
</script></body></html>
