<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#0fc7ce">
  <title>Медси Бот — тест чата</title><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="preload" as="image" href="/background.png"><link rel="stylesheet" href="/chat-overlay/overlay.css?v=8"><link rel="stylesheet" href="/chat-overlay/parent-compat.css?v=3"><link rel="stylesheet" href="/chat-overlay/overlay-fixes.css?v=7">
  <style>:root{--shell-viewport-height:100vh}@supports(height:100dvh){:root{--shell-viewport-height:100dvh}}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7fbfc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}#loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f7fbfc;color:#11424a;transition:opacity .35s ease}#loader.hidden{opacity:0;pointer-events:none}.loader-title{font-size:18px;font-weight:800;margin:0 0 10px}.loader-text{font-size:14px;color:#64868b;margin:0 0 18px}.dots{display:flex;gap:7px;align-items:center;height:32px}.dots span{display:block;border-radius:50%;background:#0fc7ce;animation:float 1.3s ease-in-out infinite}.dots span:nth-child(1){width:22px;height:22px}.dots span:nth-child(2){width:18px;height:18px;animation-delay:.1s}.dots span:nth-child(3){width:14px;height:14px;animation-delay:.2s}.dots span:nth-child(4){width:11px;height:11px;animation-delay:.3s}.dots span:nth-child(5){width:8px;height:8px;animation-delay:.4s}@keyframes float{50%{transform:translateY(-5px)}}#appFrame{position:fixed;inset:0;width:100vw;height:var(--shell-viewport-height);border:0;background:#f7fbfc;opacity:0;transition:opacity .35s ease}body.app-ready #appFrame{opacity:1}</style>
  <script src="/notify-client.js?v=20260830-lower-panel"></script><script src="/chat-overlay/transport.js?v=2"></script><script src="/chat-overlay/fast-cache.js?v=1"></script><script src="/chat-overlay/interaction-fix.js?v=5"></script><script src="/chat-overlay/preload.js?v=2"></script><script src="/chat-overlay/parent-chat.js?v=8"></script><script src="/chat-overlay/overlay-core.js?v=3"></script>
</head><body>
<div id="loader"><h1 class="loader-title">Медси Бот</h1><p class="loader-text">Тестовая версия чата</p><div class="dots"><span></span><span></span><span></span><span></span><span></span></div></div><iframe id="appFrame" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
<script>
const APP_BASE_URL='https://script.google.com/macros/s/AKfycbzRKRjjI7NoHx8rD5ifEdrcexGuYlMEB453sOC2UTZDeBaybZiNPIY0vDTMkmeHhebVpA/exec',PUSH_SERVICE_URL='https://medsi-push-worker.medsi-children.workers.dev',PARENT_PHONE_KEY='medsi_parent_phone',OVERLAY_SESSION_KEY='medsi_d1_parent_session_v1',SESSION_MESSAGE_TYPE='medsi:parent-session';
const frame=document.getElementById('appFrame'),loader=document.getElementById('loader');let overlayCleanup=null,parentWaitTimer=null,parentWait=null;
function onlyDigits(v){return String(v||'').replace(/\D+/g,'')}function savedPhone(){try{return onlyDigits(localStorage.getItem(PARENT_PHONE_KEY)||'')}catch(_){return''}}function savePhone(v){v=onlyDigits(v);if(!v)return;try{localStorage.setItem(PARENT_PHONE_KEY,v)}catch(_){}if(window.MedsiPush)MedsiPush.setIdentity({role:'parent',phone:v})}function clearPhone(){try{localStorage.removeItem(PARENT_PHONE_KEY);localStorage.removeItem(OVERLAY_SESSION_KEY)}catch(_){}if(window.MedsiPush)MedsiPush.clearIdentity()}
function savedOverlaySession(){try{const x=JSON.parse(localStorage.getItem(OVERLAY_SESSION_KEY)||'null');if(!x||!x.session||!x.session.token||Number(x.session.expiresAt||0)<=Date.now()+30000||onlyDigits(x.phone).slice(-10)!==savedPhone().slice(-10)){localStorage.removeItem(OVERLAY_SESSION_KEY);return null}return x.session}catch(_){return null}}function saveOverlaySession(data){if(!data||!data.session||!data.session.token)return;const p=onlyDigits(data.phone||savedPhone()).slice(-10);if(!p)return;try{localStorage.setItem(OVERLAY_SESSION_KEY,JSON.stringify({phone:p,session:data.session}))}catch(_){}}
function ensureParentWait(){if(parentWait)return parentWait;parentWait=document.createElement('div');parentWait.className='medsi-parent-chat-wait hidden';parentWait.innerHTML='<div class="medsi-parent-chat-wait__spinner" aria-label="Загрузка"></div>';document.body.appendChild(parentWait);return parentWait}function startParentWait(){stopParentWait();parentWaitTimer=setTimeout(()=>{parentWaitTimer=null;const w=ensureParentWait();w.classList.remove('hidden');requestAnimationFrame(()=>w.classList.add('is-visible'))},1300)}function stopParentWait(){if(parentWaitTimer){clearTimeout(parentWaitTimer);parentWaitTimer=null}if(parentWait){parentWait.classList.remove('is-visible');setTimeout(()=>{if(parentWait&&!parentWait.classList.contains('is-visible'))parentWait.classList.add('hidden')},150)}}
function allowed(origin){if(origin==='null'||origin==='https://script.google.com'||origin==='https://script.googleusercontent.com')return true;try{return /(^|\.)googleusercontent\.com$/.test(new URL(origin).hostname)}catch(_){return false}}function replyPhone(target){const p=savedPhone();if(p&&target)target.postMessage({type:SESSION_MESSAGE_TYPE,action:'restore',phone:p},'*')}function syncViewport(){const v=window.visualViewport,h=Math.round(v?v.height:window.innerHeight);if(h>0)document.documentElement.style.setProperty('--shell-viewport-height',h+'px')}function buildUrl(){const p=savedPhone();let u=APP_BASE_URL+'?ui=overlay-test-2&shellMode=parents_test';if(p)u+='#restorePhone='+encodeURIComponent(p);return u}function reveal(){document.body.classList.add('app-ready');loader.classList.add('hidden');setTimeout(()=>loader.style.display='none',360)}function helloOverlay(){if(frame.contentWindow)frame.contentWindow.postMessage({type:'medsi:chat-overlay',action:'hello',role:'parent',phone:savedPhone(),cachedSession:savedOverlaySession()},'*')}
syncViewport();window.addEventListener('orientationchange',()=>setTimeout(syncViewport,120));document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;syncViewport();replyPhone(frame.contentWindow);helloOverlay();setTimeout(helloOverlay,250)});window.addEventListener('pageshow',()=>{replyPhone(frame.contentWindow);helloOverlay()});
window.addEventListener('message',event=>{const data=event.data||{};if(!allowed(event.origin))return;if(data.type==='medsi:chat-overlay'&&data.role==='parent'){if(data.session)saveOverlaySession(data);if(data.action==='need-session'){startParentWait();const session=savedOverlaySession(),phone=savedPhone();if(session&&phone&&event.source)event.source.postMessage({type:'medsi:chat-overlay',action:'cached-session',role:'parent',phone,session},'*');return}if(data.action==='open'||data.action==='session'||data.action==='error')stopParentWait();if(data.action==='preload'){if(window.MedsiOverlayPreload)MedsiOverlayPreload.parent(data);return}}if(data.type==='medsi:parent-screen'){if(window.MedsiPush)MedsiPush.setPanelVisible(data.screen==='screenChoose');return}if(data.type!==SESSION_MESSAGE_TYPE)return;if(data.action==='save')savePhone(data.phone);else if(data.action==='clear')clearPhone();else if(data.action==='get')replyPhone(event.source)});
const overlay=window.MedsiChatOverlay.create({frameId:'appFrame',onOpen:(state,api)=>{stopParentWait();if(overlayCleanup){try{overlayCleanup()}catch(_){}overlayCleanup=null}if(state.role==='parent'&&window.MedsiParentOverlayChat)overlayCleanup=MedsiParentOverlayChat.mount(api,state)||null},onClose:()=>{stopParentWait();if(overlayCleanup){try{overlayCleanup()}catch(_){}overlayCleanup=null}}});
frame.addEventListener('load',()=>{syncViewport();reveal();replyPhone(frame.contentWindow);helloOverlay();setTimeout(helloOverlay,350);if(window.MedsiPush)MedsiPush.sendCurrentSubscription().catch(()=>{})});frame.src=buildUrl();if(window.MedsiPush){const p=savedPhone();MedsiPush.init({frameId:'appFrame',appEndpointUrl:APP_BASE_URL,pushServiceUrl:PUSH_SERVICE_URL,identity:p?{role:'parent',phone:p}:null})}window.medsiOverlayTest=overlay;window.medsiForgetCachedChatToken=()=>{try{localStorage.removeItem(OVERLAY_SESSION_KEY)}catch(_){};return true};
</script></body></html>
