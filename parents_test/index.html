<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0fc7ce">
  <title>Медси Бот — тест чата</title>
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/chat-overlay/overlay.css?v=3">
  <style>
    :root{--shell-viewport-height:100vh}
    @supports(height:100dvh){:root{--shell-viewport-height:100dvh}}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7fbfc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
    #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f7fbfc;color:#11424a;transition:opacity .35s ease}
    #loader.hidden{opacity:0;pointer-events:none}
    .loader-title{font-size:18px;font-weight:800;margin:0 0 10px}.loader-text{font-size:14px;color:#64868b;margin:0 0 18px}
    .dots{display:flex;gap:7px;align-items:center;height:32px}.dots span{display:block;border-radius:50%;background:#0fc7ce;animation:float 1.3s ease-in-out infinite}.dots span:nth-child(1){width:22px;height:22px}.dots span:nth-child(2){width:18px;height:18px;animation-delay:.1s}.dots span:nth-child(3){width:14px;height:14px;animation-delay:.2s}.dots span:nth-child(4){width:11px;height:11px;animation-delay:.3s}.dots span:nth-child(5){width:8px;height:8px;animation-delay:.4s}@keyframes float{50%{transform:translateY(-5px)}}
    #appFrame{position:fixed;inset:0;width:100vw;height:var(--shell-viewport-height);border:0;background:#f7fbfc;opacity:0;transition:opacity .35s ease}body.app-ready #appFrame{opacity:1}
  </style>
  <script src="/notify-client.js?v=20260830-lower-panel"></script>
  <script src="/chat-overlay/transport.js?v=2"></script>
  <script src="/chat-overlay/preload.js?v=2"></script>
  <script src="/chat-overlay/parent-chat.js?v=4"></script>
  <script src="/chat-overlay/overlay-core.js?v=3"></script>
</head>
<body>
  <div id="loader">
    <h1 class="loader-title">Медси Бот</h1>
    <p class="loader-text">Тестовая версия чата</p>
    <div class="dots"><span></span><span></span><span></span><span></span><span></span></div>
  </div>
  <iframe id="appFrame" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
  <script>
    const APP_BASE_URL='https://script.google.com/macros/s/AKfycbzRKRjjI7NoHx8rD5ifEdrcexGuYlMEB453sOC2UTZDeBaybZiNPIY0vDTMkmeHhebVpA/exec';
    const PUSH_SERVICE_URL='https://medsi-push-worker.medsi-children.workers.dev';
    const PARENT_PHONE_KEY='medsi_parent_phone';
    const SESSION_MESSAGE_TYPE='medsi:parent-session';
    const frame=document.getElementById('appFrame');
    const loader=document.getElementById('loader');
    let overlayCleanup=null;

    function onlyDigits(value){return String(value||'').replace(/\D+/g,'')}
    function savedPhone(){try{return onlyDigits(localStorage.getItem(PARENT_PHONE_KEY)||'')}catch(_){return ''}}
    function savePhone(phone){const value=onlyDigits(phone);if(!value)return;try{localStorage.setItem(PARENT_PHONE_KEY,value)}catch(_){};if(window.MedsiPush)MedsiPush.setIdentity({role:'parent',phone:value})}
    function clearPhone(){try{localStorage.removeItem(PARENT_PHONE_KEY)}catch(_){};if(window.MedsiPush)MedsiPush.clearIdentity()}
    function allowed(origin){if(origin==='null'||origin==='https://script.google.com'||origin==='https://script.googleusercontent.com')return true;try{return /(^|\.)googleusercontent\.com$/.test(new URL(origin).hostname)}catch(_){return false}}
    function replyPhone(target){const phone=savedPhone();if(phone&&target)target.postMessage({type:SESSION_MESSAGE_TYPE,action:'restore',phone},'*')}
    function syncViewport(){const v=window.visualViewport;const h=Math.round(v?v.height:window.innerHeight);if(h>0)document.documentElement.style.setProperty('--shell-viewport-height',h+'px')}
    function buildUrl(){const phone=savedPhone();let url=APP_BASE_URL+'?ui=overlay-test-2&shellMode=parents_test';if(phone)url+='#restorePhone='+encodeURIComponent(phone);return url}
    function reveal(){document.body.classList.add('app-ready');loader.classList.add('hidden');setTimeout(()=>loader.style.display='none',360)}
    function helloOverlay(){if(frame.contentWindow)frame.contentWindow.postMessage({type:'medsi:chat-overlay',action:'hello'},'*')}

    syncViewport();
    window.addEventListener('orientationchange',()=>setTimeout(syncViewport,120));
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState!=='visible')return;
      syncViewport();
      replyPhone(frame.contentWindow);
      helloOverlay();
      setTimeout(helloOverlay,250);
    });
    window.addEventListener('pageshow',()=>{
      replyPhone(frame.contentWindow);
      helloOverlay();
    });
    window.addEventListener('message',event=>{
      const data=event.data||{};
      if(!allowed(event.origin))return;
      if(data.type==='medsi:chat-overlay'&&data.action==='preload'&&data.role==='parent'){
        if(window.MedsiOverlayPreload)MedsiOverlayPreload.parent(data);
        return;
      }
      if(data.type==='medsi:parent-screen'){if(window.MedsiPush)MedsiPush.setPanelVisible(data.screen==='screenChoose');return}
      if(data.type!==SESSION_MESSAGE_TYPE)return;
      if(data.action==='save')savePhone(data.phone);
      else if(data.action==='clear')clearPhone();
      else if(data.action==='get')replyPhone(event.source);
    });

    const overlay=window.MedsiChatOverlay.create({
      frameId:'appFrame',
      onOpen:(state,api)=>{
        if(overlayCleanup){try{overlayCleanup()}catch(_){};overlayCleanup=null}
        if(state.role==='parent'&&window.MedsiParentOverlayChat){overlayCleanup=MedsiParentOverlayChat.mount(api,state)||null}
      },
      onClose:()=>{if(overlayCleanup){try{overlayCleanup()}catch(_){};overlayCleanup=null}}
    });
    frame.addEventListener('load',()=>{syncViewport();reveal();replyPhone(frame.contentWindow);helloOverlay();setTimeout(helloOverlay,350);if(window.MedsiPush)MedsiPush.sendCurrentSubscription().catch(()=>{})});
    frame.src=buildUrl();

    if(window.MedsiPush){
      const phone=savedPhone();
      MedsiPush.init({frameId:'appFrame',appEndpointUrl:APP_BASE_URL,pushServiceUrl:PUSH_SERVICE_URL,identity:phone?{role:'parent',phone}:null});
    }
    window.medsiOverlayTest=overlay;
  </script>
</body>
</html>
