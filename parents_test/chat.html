<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0fc7ce">
  <meta name="format-detection" content="telephone=no">
  <title>Медси Бот — чат</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#11424a;background:radial-gradient(circle at top left,rgba(15,199,206,.10),transparent 32%),radial-gradient(circle at bottom right,rgba(15,199,206,.08),transparent 28%),#f7fbfc;overflow:hidden}
    #shell{height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px}
    #card{width:min(94vmin,860px);height:min(92dvh,860px);max-width:100%;background:#fff;border:1px solid rgba(15,199,206,.18);border-radius:20px;box-shadow:0 12px 34px rgba(15,199,206,.10);padding:10px;display:flex;flex-direction:column;overflow:hidden;animation:cardIn .28s ease-out both}
    @keyframes cardIn{from{opacity:.65;transform:translateY(5px) scale(.995)}to{opacity:1;transform:none}}
    #top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;margin-bottom:8px}.back{width:48px;height:48px;border-radius:999px;border:1.5px solid rgba(22,184,192,.30);background:#fff;color:#16b8c0;font-size:25px;font-weight:800}.chips{display:flex;justify-content:center;gap:8px;min-width:0}.chip{padding:7px 14px;border-radius:999px;background:#f2fcfd;border:1px solid rgba(36,211,218,.28);color:#21aeb7;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
    #note{background:linear-gradient(135deg,#37d2d5,#18b7c5 52%,#0fa6b7);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;font-size:.84rem;line-height:1.42;box-shadow:0 12px 28px rgba(20,136,152,.22)}#note strong{display:block;margin-bottom:5px}
    #messages{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;scroll-behavior:smooth;display:flex;flex-direction:column;gap:9px;padding:10px;background:linear-gradient(rgba(255,255,255,.72),rgba(255,255,255,.72)),url('/background.png');background-size:cover;background-position:center;border:1px solid rgba(15,199,206,.24);border-radius:14px;margin-bottom:8px}.empty{margin:auto;color:#6f8d92;text-align:center;opacity:.82}.msg{max-width:85%;min-width:120px;padding:9px 11px 24px;border-radius:14px;position:relative;white-space:pre-wrap;word-break:break-word;line-height:1.4;animation:msgIn .18s ease-out both}.msg.parent{align-self:flex-end;background:#eefcfd;border:1px solid rgba(36,211,218,.18);color:#4e9fa6}.msg.educator{align-self:flex-start;background:linear-gradient(135deg,#0fc7ce,#44dbe1);color:#fff}.author{font-size:11px;font-weight:700;opacity:.75;margin-bottom:3px}.time{position:absolute;right:9px;bottom:6px;font-size:10px;opacity:.72}@keyframes msgIn{from{opacity:.72;transform:translateY(2px)}to{opacity:1;transform:none}}
    .media-frame{display:block;width:min(260px,62vw);aspect-ratio:4/3;border-radius:10px;overflow:hidden;margin-bottom:6px;background:rgba(17,66,74,.08);position:relative}.media{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .22s ease}.media.ready{opacity:1}.media-frame:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.06),rgba(255,255,255,.42),rgba(255,255,255,.06));transform:translateX(-100%);animation:shimmer 1.2s infinite}.media-frame.ready:before{display:none}@keyframes shimmer{to{transform:translateX(100%)}}
    #compose{display:grid;grid-template-columns:48px 1fr;grid-template-areas:'attach text' 'send send';gap:7px}.btn{border:0;border-radius:12px;font:inherit}.attach{grid-area:attach;background:#f2fcfd;border:1.5px solid rgba(15,199,206,.30);font-size:20px}.text{grid-area:text;height:64px;resize:none;border:1.5px solid rgba(15,199,206,.30);border-radius:12px;padding:10px 12px;font:inherit;outline:none}.send{grid-area:send;min-height:48px;background:linear-gradient(135deg,#4dd4e6,#1bb8c9);color:white;font-weight:800}.send:disabled,.attach:disabled,.text:disabled{opacity:.55}
    #error{position:absolute;z-index:20;left:50%;transform:translateX(-50%);top:18px;width:min(560px,calc(100% - 32px));padding:11px 13px;border-radius:13px;text-align:center;background:#fff1f1;color:#a63f45;border:1px solid #efbaba}.hidden{display:none!important}
    @media(max-width:560px){#shell{padding:6px}#card{width:100%;height:calc(100dvh - 12px);border-radius:18px}.chip{font-size:.82rem;padding:6px 10px}#note{font-size:.78rem}.msg{max-width:88%}}
    @media(prefers-reduced-motion:reduce){#card,.msg,.media{animation:none!important;transition:none!important}#messages{scroll-behavior:auto}}
  </style>
  <script src="/chat-overlay/transport.js?v=4"></script>
  <script src="/parents_test/prewarm.js?v=2"></script>
</head>
<body>
<div id="error" class="hidden"></div>
<main id="shell"><section id="card">
  <div id="top"><button id="back" class="back" type="button">←</button><div class="chips"><span id="child" class="chip"></span><span id="phone" class="chip"></span></div><span></span></div>
  <div id="note"><strong>Пожалуйста, пишите только по делу. Воспитатели и психологи работают с детьми и не могут отвечать круглосуточно.</strong>Здесь можно оставить пожелания по отчётам и вопросы. Ответы на них придут в составе следующего отчёта.</div>
  <div id="messages"><div class="empty">Загружаем сообщения…</div></div>
  <form id="compose"><button id="attach" class="btn attach" type="button">📎</button><input id="file" type="file" accept="image/*,video/*" hidden><textarea id="text" class="text" placeholder="Напишите сообщение…" maxlength="4000"></textarea><button id="send" class="btn send" type="submit">Отправить</button></form>
</section></main>
<script>
(function(){
 const APP='https://script.google.com/macros/s/AKfycbzRKRjjI7NoHx8rD5ifEdrcexGuYlMEB453sOC2UTZDeBaybZiNPIY0vDTMkmeHhebVpA/exec';
 const PHONE_KEY='medsi_parent_phone',LEGACY='medsi_phone',PARENT='medsi_parent',CHILD='medsi_child',D1='medsi_d1_parent_session_v1';
 const $=id=>document.getElementById(id),get=k=>{try{return localStorage.getItem(k)||''}catch(_){return''}},set=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
 const digits=v=>String(v||'').replace(/\D+/g,''),p10=v=>digits(v).slice(-10),fmt=v=>{const d=new Date(Number(v));return isNaN(d)?'':d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})};
 let session=null,phone=p10(get(PHONE_KEY)||get(LEGACY)),rows=[],busy=false,initialRendered=false;
 $('child').textContent=get(CHILD)||get(PARENT)||'Ребёнок';$('phone').textContent=phone?'8'+phone:'';$('back').onclick=()=>location.href='/parents_test/?v=chat-polish1';
 function showError(t){$('error').textContent=String(t||'Не удалось открыть чат.');$('error').classList.remove('hidden');setTimeout(()=>$('error').classList.add('hidden'),5000)}
 async function api(method,args){const r=await fetch(APP,{method:'POST',headers:{'content-type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'api',method,args:args||[]}),cache:'no-store'});const raw=await r.text();let p;try{p=JSON.parse(raw)}catch(_){throw new Error('Apps Script вернул некорректный ответ.')}if(!r.ok||!p||p.ok!==true)throw new Error((p&&p.message)||('HTTP '+r.status));return p.result}
 function cached(){try{const x=JSON.parse(get(D1)||'null');if(!x||p10(x.phone)!==phone)return null;const s=x.session||x;if(!s||!s.token||Number(s.expiresAt||0)<=Date.now()+30000)return null;return s}catch(_){return null}}
 async function getSession(){const c=cached();if(c)return c;const r=await api('getD1ChatSession',['parent',phone,'']);const s=r&&r.token?r:r&&r.session&&r.session.token?r.session:null;if(!s)throw new Error('Не удалось получить сессию чата.');set(D1,JSON.stringify({phone,session:s}));return s}
 function mediaUrl(m){const id=String(m&&m.fileId||'');if(!id)return'';if(id.startsWith('kv:')||id.startsWith('r2:'))return MedsiOverlayTransport.baseUrl+'/media/'+encodeURIComponent(id.slice(3));return'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1200'}
 function atBottom(box){return box.scrollHeight-box.scrollTop-box.clientHeight<72}
 function scrollBottom(box,instant){requestAnimationFrame(()=>{if(instant){const old=box.style.scrollBehavior;box.style.scrollBehavior='auto';box.scrollTop=box.scrollHeight;requestAnimationFrame(()=>box.style.scrollBehavior=old)}else box.scrollTop=box.scrollHeight})}
 function makeMedia(m,box,keepBottom){const u=mediaUrl(m);if(!u)return null;const frame=document.createElement('div');frame.className='media-frame';const md=document.createElement(m.type==='video'?'video':'img');md.className='media';if(m.type==='video'){md.controls=true;md.preload='metadata'}else{md.decoding='async';md.loading='eager'}const ready=()=>{frame.classList.add('ready');md.classList.add('ready');if(keepBottom)scrollBottom(box,true)};md.addEventListener(m.type==='video'?'loadedmetadata':'load',ready,{once:true});md.addEventListener('error',()=>frame.classList.add('ready'),{once:true});md.src=u;frame.appendChild(md);return frame}
 function render(next,opts){const box=$('messages'),wasBottom=opts&&'stick' in opts?opts.stick:atBottom(box),previousGap=box.scrollHeight-box.scrollTop-box.clientHeight;rows=Array.isArray(next)?next:[];box.replaceChildren();if(!rows.length){const e=document.createElement('div');e.className='empty';e.textContent='Сообщений пока нет.';box.appendChild(e);return}rows.forEach(m=>{const el=document.createElement('article');el.className='msg '+(m.side==='parent'?'parent':'educator');if(m.side!=='parent'){const a=document.createElement('div');a.className='author';a.textContent='Воспитатель';el.appendChild(a)}const media=makeMedia(m,box,wasBottom);if(media)el.appendChild(media);if(m.text){const b=document.createElement('div');b.textContent=String(m.text);el.appendChild(b)}const tm=document.createElement('span');tm.className='time';tm.textContent=fmt(m.timestamp);el.appendChild(tm);box.appendChild(el)});if(wasBottom)scrollBottom(box,!initialRendered);else requestAnimationFrame(()=>{box.scrollTop=Math.max(0,box.scrollHeight-box.clientHeight-previousGap)});initialRendered=true}
 async function refresh(forceStick){const box=$('messages'),stick=forceStick===true||atBottom(box);const r=await MedsiOverlayTransport.thread(session,phone,'',100);const next=Array.isArray(r.messages)?r.messages:[];render(next,{stick});MedsiOverlayTransport.markRead(session,'parent',phone).catch(()=>{});return r}
 function setBusy(v){busy=v;$('text').disabled=v;$('send').disabled=v;$('attach').disabled=v}
 $('compose').onsubmit=async e=>{e.preventDefault();if(busy)return;const text=$('text').value.trim();if(!text)return;const optimistic={side:'parent',type:'text',text,timestamp:Date.now(),messageKey:'pending-'+Date.now()};$('text').value='';render(rows.concat(optimistic),{stick:true});setBusy(true);try{await MedsiOverlayTransport.sendMessage(session,'parent',phone,{type:'text',text});await refresh(true)}catch(x){showError(x.message);await refresh(true).catch(()=>{})}finally{setBusy(false);$('text').focus()}};
 $('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('compose').requestSubmit()}};
 $('attach').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files&&$('file').files[0];$('file').value='';if(!f)return;if(f.size>20*1024*1024){showError('Размер файла не должен превышать 20 МБ.');return}setBusy(true);try{const up=await MedsiOverlayTransport.upload(session,phone,f);await MedsiOverlayTransport.sendMessage(session,'parent',phone,{type:up.type||(f.type.startsWith('video/')?'video':'image'),text:'',fileId:up.fileId});await refresh(true)}catch(x){showError(x.message)}finally{setBusy(false)}};
 async function start(){if(phone.length<10){location.href='/parents_test/?v=chat-polish1';return}const cachedThread=window.MedsiParentPrewarm&&MedsiParentPrewarm.peek(phone);if(cachedThread&&Array.isArray(cachedThread.messages)){render(cachedThread.messages,{stick:true})}const t0=performance.now();try{session=await getSession();const t1=performance.now();await refresh(!initialRendered);const t2=performance.now();console.info('Parent chat timings',{session:Math.round(t1-t0),thread:Math.round(t2-t1),total:Math.round(t2-t0),cached:!!cachedThread})}catch(e){showError(e.message||'Чат недоступен.')}}start();
})();
</script>
</body></html>
