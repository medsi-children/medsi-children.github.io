<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4fbfa">
  <title>Медси Бот — помощник</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/new/style.css?v=20261001-9">
  <script defer src="/parents/smart-bot.js?v=20261001-4"></script>
  <script defer src="/new/app.js?v=20261001-8"></script>
</head>
<body>
  <main class="assistant-lab" aria-label="Медси Бот">
    <section class="bot-stage" aria-label="Анимированный Медси Бот">
      <div class="stage-copy">
        <h1>Медси Бот</h1>
        <p>Ваш ИИ-помощник</p>
      </div>
      <div id="bot" class="bot" aria-hidden="true">
        <span class="bot-glow"></span>
        <svg class="bot-body" viewBox="0 0 160 160"><defs><linearGradient id="botFill" x1="18" y1="14" x2="142" y2="149" gradientUnits="userSpaceOnUse"><stop stop-color="#68ddd0"/><stop offset=".55" stop-color="#32cbd0"/><stop offset="1" stop-color="#1ab8c8"/></linearGradient></defs><path d="M61 6C98 5 145 31 154 70C164 111 128 147 87 156C44 165 4 136 2 95C-1 55 25 8 61 6Z" fill="url(#botFill)"/></svg>
        <span id="botEyes" class="bot-eyes"><i class="bot-eye"></i><i class="bot-eye"></i></span>
      </div>
    </section>

    <section class="help-panel" aria-label="Диалог с помощником">
      <header class="help-header">
        <div><h2>Медси Бот</h2><span class="assistant-subtitle">Ваш ИИ-помощник</span></div>
        <span class="online"><i></i> Онлайн</span>
      </header>

      <div id="conversation" class="conversation" role="log" aria-live="polite" aria-relevant="additions text"></div>

      <form id="composer" class="composer" autocomplete="off">
        <label class="sr-only" for="messageInput">Ваш вопрос</label>
        <input id="messageInput" type="text" maxlength="500" placeholder="" enterkeyhint="send">
        <button type="submit" aria-label="Отправить вопрос"><svg class="send-plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 3.1 3.9 10.2c-.9.36-.88 1.65.03 1.98l6.95 2.53 2.54 6.99c.33.91 1.62.93 1.99.04L22 4.44c.39-1.02.61-1.82-.4-1.34ZM12.4 13.9l-1.08-1.08 6.15-5.34-5.07 6.42Z"/></svg></button>
      </form>
    </section>
  </main>
</body>
</html>
