<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf7f5">
  <title>Медси Бот — пробный интерфейс</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/new/style.css?v=20261001-2">
  <script defer src="/new/app.js?v=20261001-2"></script>
</head>
<body>
  <div class="page-shell">
    <main class="chat-shell" aria-label="Демонстрация нового родительского интерфейса">
      <header class="chat-header">
        <div class="header-avatar" aria-hidden="true"><span class="bot-face"><span class="bot-eye"></span><span class="bot-eye"></span><span class="bot-mouth"></span></span></div>
        <div class="header-copy"><strong>Медси Бот</strong><span class="header-status"><span></span> На связи</span></div>
      </header>

      <div id="conversation" class="conversation" role="log" aria-live="polite" aria-relevant="additions text">
        <div class="date-divider"><span>Сегодня</span></div>
      </div>

      <form id="composer" class="composer" autocomplete="off">
        <label class="sr-only" for="messageInput">Ваше сообщение</label>
        <input id="messageInput" type="text" maxlength="500" placeholder="Спросите об отчёте или напишите сообщение…" enterkeyhint="send">
        <button class="send-button" type="submit" aria-label="Отправить сообщение"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </form>
    </main>
  </div>
</body>
</html>
