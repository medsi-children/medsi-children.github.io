<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <meta name="theme-color" content="#f4fbfa">
  <script>if(new URLSearchParams(location.search).has('embedded'))document.documentElement.dataset.embedded='1';</script>
  <title>Медси Бот — помощник</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/parents/psychology-format.css?v=20260905-production">
  <link rel="stylesheet" href="/new/style.css?v=20261002-16">
  <link rel="stylesheet" href="/parents/bot-character.css?v=20261003-1">
  <script defer src="/parents/psychology-format.js?v=20260909-leading-dot-1"></script>
  <script defer src="/parents/smart-bot.js?v=20261002-15"></script>
  <script defer src="/new/app.js?v=20261003-5"></script>
  <script>
    // После первого открытия сервис-воркер всегда берёт /new и её файлы из сети.
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js?v=20261001-new-live-1').catch(() => {});
  </script>
</head>
<body>
  <main class="assistant-lab" aria-label="Медси Бот">
    <section class="bot-stage" aria-label="Анимированный Медси Бот">
      <div class="stage-copy">
        <h1>Медси Бот</h1>
        <p>Ваш ИИ-помощник</p>
        <a id="botLogLink" class="bot-log-link" href="/new/logs.html" hidden>Журнал диалогов</a>
      </div>
      <div id="bot" class="bot medsi-character" aria-hidden="true">
        <span class="bot-glow medsi-character-glow"></span>
        <img class="bot-body medsi-character-body" src="/new/blob.png" alt="">
        <span id="botEyes" class="bot-eyes medsi-character-eyes"><i class="bot-eye medsi-character-eye"></i><i class="bot-eye medsi-character-eye"></i></span>
      </div>
    </section>

    <section class="help-panel" aria-label="Диалог с помощником">
      <header class="help-header">
        <div class="help-header-brand">
          <button id="botBack" class="bot-back" type="button" aria-label="Назад" title="Назад"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
          <div><h2>Медси Бот</h2><span class="assistant-subtitle">Ваш ИИ-помощник</span></div>
        </div>
        <span class="online"><i></i> Онлайн</span>
      </header>

      <div id="conversation" class="conversation" role="log" aria-live="polite" aria-relevant="additions text"></div>

      <div id="promptStrip" class="prompt-strip" aria-label="Готовые вопросы. Пролистайте в сторону, чтобы увидеть остальные">
        <button type="button" data-prompt="Утренний отчёт">Утренний отчёт</button>
        <button type="button" data-prompt="Вечерний отчёт">Вечерний отчёт</button>
        <button type="button" data-prompt="Групповая психотерапия">Групповая терапия</button>
        <button type="button" data-prompt="Режим дня">Режим дня</button>
        <button type="button" data-prompt="Написать воспитателям">Написать воспитателям</button>
        <button type="button" data-prompt="Доставка">Доставка</button>
        <button type="button" data-prompt="Когда можно встретиться с ребёнком?">Встречи с детьми</button>
        <button type="button" data-prompt="Вопрос о лечении">Лечение</button>
        <button type="button" data-prompt="Вопрос о лекарствах">Лекарства</button>
        <button type="button" data-prompt="Как оплатить?">Вопрос по оплате</button>
        <button type="button" data-prompt="Телефон врача">Телефон врача</button>
        <button type="button" data-prompt="Занятия с психологом">Занятия с психологом</button>
        <button type="button" data-prompt="Почему нет отчёта?">Нет отчёта</button>
      </div>

      <form id="composer" class="composer" autocomplete="off">
        <label class="sr-only" for="messageInput">Ваш вопрос</label>
        <input id="messageInput" type="text" maxlength="500" placeholder="" enterkeyhint="send">
        <button type="submit" aria-label="Отправить вопрос"><svg class="send-plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21 23 12 2 3v7l15 2-15 2v7Z"/></svg></button>
      </form>
    </section>
  </main>
</body>
</html>
