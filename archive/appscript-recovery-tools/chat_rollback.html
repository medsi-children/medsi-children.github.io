<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7fbfc"><title>Медси — rollback чата</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#f7fbfc;color:#173f46;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:820px;margin:auto}.card{background:white;border:1px solid rgba(15,199,206,.22);border-radius:18px;padding:20px;margin:0 0 14px;box-shadow:0 10px 28px rgba(15,199,206,.08)}h1{margin:0 0 8px;color:#0aa8b0;font-size:1.55rem}.muted{color:#66878c;line-height:1.45}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;margin:6px 8px 6px 0;background:#eaf8f9;color:#14616a}button.danger{background:#d73d50;color:#fff}button:disabled{opacity:.55}.status{margin-top:12px;white-space:pre-wrap;word-break:break-word;background:#f2f7f8;border:1px solid #dcebed;border-radius:12px;padding:13px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.ok{background:#edf9f3}.err{background:#fff1f1;color:#7b2d38}</style></head><body><div class="wrap"><section class="card"><h1>Аварийный rollback чата D1 → Sheets</h1><div class="muted">Не удаляет D1/KV. Сначала аудит. Восстановление копирует недостающие сообщения и вложения в Google Drive, затем переключает только основной Apps Script чат на Sheets.</div></section><section class="card"><button id="audit">1. Аудит без изменений</button><button id="restore" class="danger">2. Восстановить и переключить на Sheets</button><button id="catchup">3. Финальная догонка после перезапуска ботов</button><div id="status" class="status">ROLLBACK-BUILD 1</div></section></div><script>const APP='https://script.google.com/macros/s/AKfycbzRKRjjI7NoHx8rD5ifEdrcexGuYlMEB453sOC2UTZDeBaybZiNPIY0vDTMkmeHhebVpA/exec',KEY='medsi_tutor_session_v1',$=id=>document.getElementById(id);function token(){try{return String(localStorage.getItem(KEY)||'')}catch(_){return''}}function show(v,kind){const s=$('status');s.className='status '+(kind||'');s.textContent=typeof v==='string'?v:JSON.stringify(v,null,2)}async function api(method,args){const t=token();if(!t)throw new Error('Нет tutor session. Сначала войдите в tutors_test.');const r=await fetch(APP,{method:'POST',headers:{'content-type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'api',method,args:[t].concat(args||[])})});const x=await r.json();if(!r.ok||!x||x.ok!==true)throw new Error((x&&x.message)||('HTTP '+r.status));return x.result}async function run(btn,method,args){btn.disabled=true;show('Выполняется…');try{const r=await api(method,args);show(r,r&&r.ok===false?'err':'ok')}catch(e){show(e.message||String(e),'err')}finally{btn.disabled=false}}$('audit').onclick=()=>run($('audit'),'auditD1ToSheetsRollback',[]);$('restore').onclick=()=>{if(confirm('Сотрудникам лучше не отправлять сообщения ближайшую минуту. Начать перенос и переключить основной чат на Sheets?'))run($('restore'),'restoreD1ToSheetsRollback',[true])};$('catchup').onclick=()=>run($('catchup'),'restoreD1ToSheetsRollback',[false]);</script></body></html>
