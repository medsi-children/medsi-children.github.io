<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Medsi Upload Test</title>
  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      max-width:680px;
      margin:0 auto;
      padding:30px 18px;
      background:#f6f8f9;
      color:#172126;
    }
    .card{
      background:white;
      border-radius:22px;
      padding:22px;
      box-shadow:0 8px 30px rgba(0,0,0,.08);
    }
    button{
      width:100%;
      min-height:54px;
      border:0;
      border-radius:16px;
      font-size:17px;
      font-weight:700;
      background:#19c4c9;
      color:white;
    }
    button:disabled{opacity:.5}
    #status{
      margin-top:18px;
      white-space:pre-wrap;
      line-height:1.45;
    }
    img,video{
      display:block;
      max-width:100%;
      max-height:500px;
      margin-top:18px;
      border-radius:16px;
    }
    .small{opacity:.65;font-size:14px;margin-top:12px}
  </style>
</head>
<body>
  <div class="card">
    <h2>Тест загрузки вложений</h2>
    <p>Эта страница не отправляет сообщения и не трогает основной чат.</p>

    <input id="file" type="file" accept="image/*,video/*" hidden>
    <button id="choose">Выбрать фото или видео</button>

    <div id="status">Жду файл.</div>
    <div id="preview"></div>
    <div class="small" id="details"></div>
  </div>

<script>
const BASE = 'https://medsi-chat-upload-test.medsi-children.workers.dev';

const fileInput = document.getElementById('file');
const choose = document.getElementById('choose');
const status = document.getElementById('status');
const preview = document.getElementById('preview');
const details = document.getElementById('details');

choose.onclick = () => fileInput.click();

function makeId(){
  if (crypto.randomUUID) return crypto.randomUUID();
  return Date.now() + '-' + Math.random().toString(36).slice(2);
}

async function uploadOnce(file, uploadId){
  const response = await fetch(BASE + '/upload', {
    method: 'POST',
    headers: {
      'Content-Type': file.type || 'application/octet-stream',
      'X-Medsi-Upload-Id': uploadId,
      'X-File-Name': file.name || 'attachment'
    },
    body: file
  });

  let result;
  try {
    result = await response.json();
  } catch {
    throw new Error('Worker вернул некорректный ответ');
  }

  if (!response.ok || !result.ok) {
    throw new Error(result.message || ('HTTP ' + response.status));
  }

  return result;
}

fileInput.onchange = async () => {
  const file = fileInput.files && fileInput.files[0];
  fileInput.value = '';
  if (!file) return;

  choose.disabled = true;
  preview.replaceChildren();

  const uploadId = makeId();
  const started = performance.now();

  status.textContent =
    'Загрузка…\n' +
    file.name + '\n' +
    (file.size / 1024 / 1024).toFixed(2) + ' МБ';

  let result;
  let firstError = '';

  try {
    try {
      result = await uploadOnce(file, uploadId);
    } catch (e) {
      firstError = e && e.message || String(e);

      status.textContent =
        'Первая попытка дала ошибку:\n' +
        firstError +
        '\n\nПовторяю с тем же uploadId…';

      await new Promise(r => setTimeout(r, 500));

      result = await uploadOnce(file, uploadId);
    }

    const elapsed = ((performance.now() - started) / 1000).toFixed(2);
    const mediaUrl = BASE + result.url;

    status.textContent =
      '✅ Готово за ' + elapsed + ' сек.\n' +
      (result.reused
        ? 'Worker вернул уже загруженный файл — защита от дублей сработала.'
        : 'Файл загрузился с первой успешной попытки.');

    if (firstError) {
      status.textContent += '\n\nПервая ошибка Safari: ' + firstError;
    }

    const media = document.createElement(
      result.type === 'video' ? 'video' : 'img'
    );

    media.src = mediaUrl;

    if (result.type === 'video') {
      media.controls = true;
    }

    preview.appendChild(media);

    details.textContent =
      'uploadId: ' + uploadId +
      '\nreused: ' + String(result.reused);

  } catch (e) {
    const elapsed = ((performance.now() - started) / 1000).toFixed(2);

    status.textContent =
      '❌ Не удалось загрузить после двух попыток.\n' +
      (e && e.message || String(e)) +
      '\nВремя: ' + elapsed + ' сек.';
  } finally {
    choose.disabled = false;
  }
};
</script>
</body>
</html>
