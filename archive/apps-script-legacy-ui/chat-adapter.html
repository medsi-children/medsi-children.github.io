<script>
/* Production chat transport. It starts in Sheets mode and switches only when
 * the server-side migration gate has been verified. */
(() => {
  const D1_URL = 'https://medsi-chat-worker.medsi-children.workers.dev';
  let mode = 'sheets';
  let readyPromise;
  const sessions = new Map();

  function isIOSReadTransport(){
    const ua = String(navigator.userAgent || '');
    const platform = String(navigator.platform || '');
    return /iPad|iPhone|iPod/i.test(ua) ||
      (platform === 'MacIntel' && Number(navigator.maxTouchPoints || 0) > 1);
  }

  function callAppsScript(name, args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[name].apply(runner, args || []);
    });
  }
  function getSession(role, phone, tutorToken) {
    // An educator token is intentionally panel-wide: the Worker authorizes
    // that role for every tutor thread. Reusing the token returned by the
    // login check avoids a separate multi-second Apps Script round-trip for
    // every phone. Parent sessions remain strictly phone-scoped.
    const sessionPhone = role === 'educator' ? '' : String(phone || '');
    const key = [role, sessionPhone, String(tutorToken || '')].join('|');
    const cached = sessions.get(key);
    if (cached && cached.expiresAt > Date.now() + 10000) return Promise.resolve(cached);
    return callAppsScript('getD1ChatSession', [role, sessionPhone, tutorToken || '']).then(value => {
      sessions.set(key, value); return value;
    }).catch(error => {
      error.medsiChatCause = 'SESSION';
      throw error;
    });
  }
  async function request(role, phone, tutorToken, path, options) {
    const auth = await getSession(role, phone, tutorToken);
    let response;
    const transportOptions = { ...(options || {}) };
    const simpleRead = !!transportOptions.simpleRead;
    const simpleWrite = !!transportOptions.simpleWrite;
    delete transportOptions.simpleRead;
    delete transportOptions.simpleWrite;
    try {
      // Samsung Internet occasionally leaves a cross-origin request with a
      // custom auth header pending after the OPTIONS preflight.  Read-only
      // calls use a text/plain POST instead: it is a CORS "simple request",
      // so there is no preflight and the signed five-minute token never goes
      // into the URL.
      response = simpleRead
        ? await fetch(D1_URL + path, {
            ...transportOptions,
            method: 'POST',
            // Be explicit: Safari otherwise may omit the inferred type, and
            // the Worker then cannot safely read the short-lived token from
            // this CORS-simple request body.
            headers: { ...(transportOptions.headers || {}), 'content-type':'text/plain;charset=UTF-8' },
            body: JSON.stringify({ _medsiChatSession: auth.token })
          })
        : simpleWrite
          ? await fetch(D1_URL + path, {
              ...transportOptions,
              method: 'POST',
              // Keep writes direct to Worker/D1, but avoid the separate
              // mobile CORS preflight that can stall before the POST begins.
              headers: { ...(transportOptions.headers || {}), 'content-type':'text/plain;charset=UTF-8' },
              body: JSON.stringify({
                ...JSON.parse(String(transportOptions.body || '{}')),
                _medsiChatSession: auth.token
              })
            })
        : await fetch(D1_URL + path, {
            ...transportOptions,
            headers: { ...(transportOptions.headers || {}), 'X-Medsi-Chat-Session': auth.token }
          });
    } catch (error) {
      error.medsiChatCause = 'NETWORK';
      throw error;
    }
    let payload;
    try { payload = await response.json(); }
    catch (error) {
      error.medsiChatCause = 'BAD_RESPONSE';
      throw error;
    }
    if (!response.ok || !payload.ok) {
      const error = new Error(payload.message || 'Ошибка чата');
      error.medsiChatCause = 'HTTP-' + response.status;
      throw error;
    }
    return payload;
  }
  function displayTime(value) {
    const date = new Date(Number(value));
    if (Number.isNaN(date.getTime())) return String(value || '');
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const msgDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const diffDays = Math.round((today - msgDay) / (24 * 60 * 60 * 1000));
    const label = diffDays === 0
      ? 'сегодня'
      : diffDays === 1
        ? 'вчера'
        : date.toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
    return label + ' · ' +
      date.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
  }
  function requestEducatorThread(role, phone, tutorToken, beforeKey, limit) {
    const path = '/lab/threads/' + encodeURIComponent(phone) +
      '?before=' + encodeURIComponent(beforeKey || '') + '&limit=' + encodeURIComponent(limit || 50);
    // Android keeps the CORS-simple POST that removed its hanging OPTIONS
    // requests. iOS uses the original header-authenticated GET: that was the
    // fast path on iPhone, while text/plain POSTs can sit until the fallback
    // timer even though the Worker itself is healthy.
    const direct = request(role, phone, tutorToken, path,
      isIOSReadTransport() ? {} : { simpleRead:true });
      // A few mobile browsers keep the cross-site Worker request pending even
      // though the same Worker and D1 data are healthy. Keep the direct route
      // as the fast path; on iOS race the same D1 Apps Script proxy immediately
      // so the first opened thread does not sit on the skeleton for seconds.
    if (role !== 'educator') return direct;
    return new Promise((resolve, reject) => {
      let settled = false;
      let fallbackStarted = false;
      const finish = (fn, value) => {
        if (settled) return;
        settled = true;
        fn(value);
      };
      const startFallback = () => {
        if (settled || fallbackStarted) return;
        fallbackStarted = true;
        callAppsScript('getD1ThreadForEducator', [phone, tutorToken || '', beforeKey || '', limit || 50])
          .then(value => finish(resolve, value), error => finish(reject, error));
      };
      direct.then(value => finish(resolve, value), startFallback);
      setTimeout(startFallback, isIOSReadTransport() ? 0 : 1800);
    });
  }
  function normalizeMessage(message) {
    const item = { ...message, timestamp: displayTime(message.timestamp) };
    if (item.fileId && (String(item.fileId).startsWith('kv:') || String(item.fileId).startsWith('r2:'))) {
      item.mediaUrl = D1_URL + '/media/' + encodeURIComponent(String(item.fileId).slice(3)) +
        '?v=' + encodeURIComponent(String(item.messageKey || '1'));
      if (item.type === 'video') item.videoUrl = item.mediaUrl;
    } else if (item.fileId) {
      item.mediaUrl = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(item.fileId) + '&sz=w1200';
    }
    return item;
  }

  async function optimizeLargeChatImage(file) {
    if (!file || !/^image\//i.test(String(file.type || '')) || Number(file.size || 0) <= 4 * 1024 * 1024) {
      return file;
    }

    let source = null;
    let objectUrl = '';
    try {
      if (typeof createImageBitmap === 'function') {
        try { source = await createImageBitmap(file, { imageOrientation:'from-image' }); } catch (_) {}
      }
      if (!source) {
        objectUrl = URL.createObjectURL(file);
        source = await new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error('Не удалось подготовить фотографию.'));
          image.src = objectUrl;
        });
      }

      const width = Number(source.naturalWidth || source.width || 0);
      const height = Number(source.naturalHeight || source.height || 0);
      if (!width || !height) return file;
      const scale = Math.min(1, 2048 / Math.max(width, height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(width * scale));
      canvas.height = Math.max(1, Math.round(height * scale));
      const context = canvas.getContext('2d', { alpha:false });
      if (!context) return file;
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(source, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.82));
      if (!blob || !blob.size || blob.size >= file.size) return file;
      const originalName = String(file.name || 'photo').replace(/\.[^.]+$/, '') || 'photo';
      return new File([blob], originalName + '.jpg', { type:'image/jpeg', lastModified:Date.now() });
    } catch (_) {
      // If a browser cannot decode a selected format, preserve the existing
      // upload path instead of preventing the user from sending the file.
      return file;
    } finally {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      if (source && typeof source.close === 'function') source.close();
    }
  }
  readyPromise = callAppsScript('getChatBackendConfig', []).then(config => {
    mode = config && config.backend === 'd1' ? 'd1' : 'sheets';
    return { mode };
  }).catch(() => { mode = 'd1'; return { mode:'d1' }; });
  window.MedsiChatBackend = {
    get mode() { return mode; }, isD1: () => mode === 'd1', ready: () => readyPromise,
    isIOSReadTransport: isIOSReadTransport,
    getThread: (role, phone, tutorToken, beforeKey, limit) => requestEducatorThread(role, phone, tutorToken, beforeKey, limit)
      .then(payload => ({ ...payload, closed:false, messages:(payload.messages || []).map(normalizeMessage) })),
    // Starts the only Apps Script round-trip needed by D1 while the shell
    // animation is visible.  getSession() de-duplicates concurrent callers.
    warmSession: (role, phone, tutorToken) => readyPromise.then(() => {
      if (mode !== 'd1') return null;
      return getSession(role, phone || '', tutorToken || '');
    }),
    // A successful tutor login/check already comes from Apps Script.  Reuse
    // the D1 token returned in that response rather than making a second,
    // serial Apps Script request before chat warming can begin.
    primeSession: (role, phone, tutorToken, session) => {
      const value = session || {};
      if (!value.token || !Number(value.expiresAt)) return null;
      const sessionPhone = role === 'educator' ? '' : String(phone || '');
      const key = [role, sessionPhone, String(tutorToken || '')].join('|');
      sessions.set(key, value);
      // getTutorD1Session_ only returns a token when the server-side D1 gate
      // is active, so the successful login response can settle readiness
      // immediately instead of waiting for a redundant Apps Script callback.
      if (role === 'educator') {
        mode = 'd1';
        readyPromise = Promise.resolve({ mode:'d1' });
      }
      return value;
    },
    listChats: (tutorToken, bucket) => request('educator', '', tutorToken,
      '/lab/chats?bucket=' + encodeURIComponent(bucket || 'all'),
      isIOSReadTransport() ? {} : { simpleRead:true }),
    sendMessage: (role, phone, tutorToken, message) => {
      const send = role === 'educator' && isIOSReadTransport()
        ? callAppsScript('sendD1MessageForEducator', [phone, message, tutorToken || ''])
        : request(role, phone, tutorToken, '/lab/messages', {
            method:'POST',
            simpleWrite:true,
            body:JSON.stringify({ ...message, phone, side:role })
          });

      return send.then(payload => ({
        ...payload,
        messageKey:payload.message && payload.message.messageKey || '',
        timestamp:displayTime(payload.message && payload.message.timestamp)
      }));
    },
    markRead: (role, phone, tutorToken) => request(role, phone, tutorToken,
      role === 'educator' ? '/lab/read/' + encodeURIComponent(phone) : '/lab/read-parent/' + encodeURIComponent(phone), { method:'POST' }),
    react: (role, phone, tutorToken, key, reaction) => request(role, phone, tutorToken, '/lab/reaction/' + encodeURIComponent(key), { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({reaction}) }),
    edit: (role, phone, tutorToken, key, text) => request(role, phone, tutorToken, '/lab/edit/' + encodeURIComponent(key), { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({actor:role,text}) }),
    remove: (role, phone, tutorToken, key) => request(role, phone, tutorToken, '/lab/delete/' + encodeURIComponent(key), { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({actor:role}) }),
    pin: (phone, tutorToken, bucket) => request('educator', phone, tutorToken, '/lab/pin/' + encodeURIComponent(phone), { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({bucket}) }),
    uploadAttachment: async (role, phone, tutorToken, file) => {
      const auth = await getSession(role, phone, tutorToken);
      const uploadFile = await optimizeLargeChatImage(file);
      const form = new FormData();
      form.append('_medsiChatSession', auth.token);
      form.append('phone', String(phone || ''));
      form.append('file', uploadFile, String(uploadFile && uploadFile.name || 'attachment'));

      const response = await fetch(D1_URL + '/lab/upload-form', {
        method:'POST',
        body:form
      });
      const payload = await response.json();
      if (!response.ok || !payload.ok) throw new Error(payload.message || 'Не удалось загрузить файл.');
      return { ...payload, url: D1_URL + String(payload.url || '') };
    },
    notify: (role, phone, tutorToken, type, text) => callAppsScript('notifyD1ChatMessage', [phone,role,type,text,tutorToken || ''])
  };
})();
</script>
