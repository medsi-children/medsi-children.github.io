<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <title>Журнал Медси Бота</title>
  <link rel="stylesheet" href="/parents/bot-logs.css?v=1">
  <script defer src="/parents/bot-logs.js?v=1"></script>
</head>
<body>
  <main class="log-page">
    <header class="log-header">
      <a href="/" aria-label="Назад к Медси Боту">←</a>
      <div><h1>Журнал диалогов</h1><p>Медси Бот · последние 30 дней</p></div>
    </header>
    <form id="accessForm" class="access-card">
      <label for="accessKey">Ключ доступа</label>
      <input id="accessKey" type="password" autocomplete="off" required>
      <button type="submit">Открыть журнал</button>
      <p>Ключ действует только в этой открытой вкладке.</p>
    </form>
    <p id="status" class="status" role="status"></p>
    <section id="logView" hidden>
      <div class="log-toolbar"><h2>Диалоги</h2><button id="refresh" type="button">Обновить</button></div>
      <div id="sessions" class="sessions"></div>
      <button id="loadMore" class="load-more" type="button" hidden>Показать ещё</button>
      <p class="hint">Новые записи могут появиться в журнале не сразу. Имена и телефоны не добавляются к записи отдельно; если их напишут в сообщении, они останутся в его тексте.</p>
    </section>
  </main>
</body>
</html>
